// [WORKING] / [ÇALIŞIYOR] — Character.CombatSpeedEra -> CombatEngine swing time.
COMBATSPEEDERA=0

// COMBATPARRYINGERA - Parry behaviour flags (Source-X PARRYERA_*).
//                     Parry davranışı bayrakları (Source-X PARRYERA_*).
// Type / Tür: flags, Sphere rule (leading zero = hex, | ORs values, e.g. 01|010) /
//             bayrak, Sphere kuralı (baştaki sıfır = onaltılık, | değerleri OR'lar, örn. 01|010)
//   0x01 PRESEFORMULA - pre-SE parry chance (no Bushido); not with 0x02
