BACKPACKOVERLOAD=40

// --- The cost of a load (Source-X CCharAct.cpp:4787-4829) -------------------
// --- Yükün bedeli (Source-X CCharAct.cpp:4787-4829) -------------------------
// All four are paid ONLY on a committed step: a pathfinding probe, a check-only
// call and a GM pay nothing.
// Dördü de YALNIZCA gerçekleşen adımda ödenir: yol arama denemesi, yalnızca
// kontrol çağrısı ve GM hiçbir şey ödemez.

// STAMINALOSSATWEIGHT - Load percent at which a step starts costing stamina. Not a
//                       threshold but the MIDPOINT of an S-curve: at this load half
//                       the steps cost a point, the chance falls fast below it and
//                       climbs fast above it (variance 10). 200 = effect off,
//                       because past 100% the overweight branch takes over.
//                       Adımın stamina yakmaya başladığı yük yüzdesi. Eşik DEĞİL,
//                       S-eğrisinin ORTA NOKTASIDIR: bu yükte adımların yarısı bir
//                       puan yakar, altında hızla düşer, üstünde hızla tırmanır
//                       (varyans 10). 200 = etki kapalı, çünkü %100'ü geçince
//                       aşırı-yük dalı devreye girer.
// Type / Tür: integer (%)
// Default / Varsayılan: 150
// [WORKING] / [ÇALIŞIYOR] — MovementEngine.StaminaLossAtWeight.
STAMINALOSSATWEIGHT=150

// STAMINALOSSOVERWEIGHT - Stamina cost of each step taken OVER the carry weight.
//                         This branch is not a chance but CERTAIN: paid every step
//                         and growing — +1 per 5 stones over the limit, a third of
//                         the total when mounted.
//                         Taşıma limitinin ÜSTÜNDE atılan her adımın stamina bedeli.
//                         Bu dal şans değil, KESİNDİR: her adımda ödenir ve büyür —
//                         limitin üstündeki her 5 taş için +1, binekliyken toplamın
//                         üçte biri.
// Type / Tür: integer
// Default / Varsayılan: 5
// [WORKING] / [ÇALIŞIYOR] — MovementEngine.StaminaLossOverweight.
STAMINALOSSOVERWEIGHT=5

// RUNNINGPENALTY - Points added to the load percent while flying/hovering. The name
//                  says running, the code checks STATF_FLY | STATF_HOVERING
//                  (CCharAct.cpp:4799) — the reference's own comment there calls the
//                  flat addition a FIXME. The behaviour is matched, not the name:
//                  running on foot costs nothing extra.
//                  Uçarken/süzülürken yük yüzdesine eklenen puan. Adı "koşma" der,
//                  kod STATF_FLY | STATF_HOVERING'e bakar (CCharAct.cpp:4799) —
//                  referansın kendi yorumu oradaki düz eklemeye FIXME der. Davranış
//                  eşlendi, ad değil: yayan koşmak fazladan bir şey ödetmez.
// Type / Tür: integer (0 = no penalty / ceza yok)
// Default / Varsayılan: 50
// [WORKING] / [ÇALIŞIYOR] — MovementEngine.RunningPenalty.
RUNNINGPENALTY=50

// RUNNINGPENALTYOVERWEIGHT - Percent uplift of the overweight cost while
//                            flying/hovering. DELIBERATE DIVERGENCE: the reference's
//                            key table ties this name to its NEIGHBOUR's field
//                            (CServerConfig.cpp:981-982), so setting it there moves
//                            RUNNINGPENALTY and the overweight uplift never leaves
//                            its default. That is a copy-paste slip in a table, not a
//                            contract: the consumer reads the field by name
//                            (CCharAct.cpp:4823). The key is wired to the field it names.
//                            Uçarken/süzülürken aşırı-yük bedelinin yüzde artışı.
//                            BİLİNÇLİ SAPMA: referansın anahtar tablosu bu adı
//                            KOMŞUSUNUN alanına bağlamış (CServerConfig.cpp:981-982);
//                            orada bunu kurmak RUNNINGPENALTY'yi oynatır ve aşırı-yük
//                            artışı varsayılanından hiç çıkmaz. Bu bir tablo
//                            kopyala-yapıştır hatasıdır, sözleşme değil: tüketim yeri
