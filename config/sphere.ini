//   0x20 ONEHANDBLOCK - parry with a one-handed weapon, no shield
//                       kalkansız tek elli silahla parry
//   0x40 TWOHANDBLOCK - parry with two-handed weapons / iki elli silahla parry
//   0x80 ARSCALING    - shield AR scales with Parrying / kalkan AR'si Parrying ile ölçeklenir
// Default / Varsayılan: 01|010 (PRESEFORMULA | SHIELDBLOCK, Source-X default)
