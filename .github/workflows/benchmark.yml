name: Nightly Benchmark

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      workers:
        description: "MulticoreWorkerCount values to compare (comma separated)"
        default: "1,4"
      bots:
        description: "Real-socket bot counts (comma separated; each needs a baseline profile)"
        default: "50,200"
      duration:
        description: "Measured window per run, seconds"
        default: "45"

permissions:
  contents: read

jobs:
  load-benchmark:
    name: Real-socket load benchmark
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore sphereNet.sln

      - name: Build Release
        run: dotnet build sphereNet.sln --configuration Release --no-restore

      - name: Run benchmark-safe tests
        run: dotnet test src/SphereNet.Tests/SphereNet.Tests.csproj --configuration Release --no-build --no-restore --filter "RuntimePerformancePressureTests|SaveFormatTests|PerfMeasurementWindowTests|MapCellReadTests" --verbosity normal

      # Builds a synthetic shard (flat map, NPC town, ground items, one player account
      # per bot), starts SphereNet.Server on it as a child process, logs the bots in
      # over TCP and measures a fixed walk/speech/double-click scenario with one world
      # save in the middle. Fails the job when a run is incomplete or a metric breaks
      # src/SphereNet.LoadTest/loadtest-baseline.json.
      - name: Run load scenario
        shell: pwsh
        env:
          LT_WORKERS: ${{ github.event.inputs.workers || '1,4' }}
          LT_BOTS: ${{ github.event.inputs.bots || '50,200' }}
          LT_DURATION: ${{ github.event.inputs.duration || '45' }}
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet bin/Release/SphereNet.LoadTest.dll `
            --workers $env:LT_WORKERS --bots $env:LT_BOTS `
            --duration $env:LT_DURATION --warmup 10 `
            --work "$env:RUNNER_TEMP/loadtest" `
            --out artifacts/loadtest-results.json `
            --baseline src/SphereNet.LoadTest/loadtest-baseline.json `
            --check --commit "$env:GITHUB_SHA"
          exit $LASTEXITCODE

      - name: Collect server logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/server-logs | Out-Null
          Get-ChildItem "$env:RUNNER_TEMP/loadtest" -Recurse -Filter server-console.log -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName ("artifacts/server-logs/" + $_.Directory.Name + ".log") }

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-load
          path: artifacts/
