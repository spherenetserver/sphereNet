name: Nightly Benchmark Smoke

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  benchmark-smoke:
    name: Benchmark smoke
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore sphereNet.sln

      - name: Build Release
        run: dotnet build sphereNet.sln --configuration Release --no-restore

      - name: Run benchmark-safe tests
        run: dotnet test src/SphereNet.Tests/SphereNet.Tests.csproj --configuration Release --no-build --no-restore --filter "RuntimePerformancePressureTests|SaveFormatTests" --verbosity normal

      - name: Write benchmark artifact (no load measurement)
        shell: pwsh
        run: |
          # This job only runs the benchmark-safe smoke tests. It does not start a
          # server or drive bots, so there is no tick, GC or duration data to report:
          # the artifact says so instead of carrying zeros that read as a baseline.
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $artifact = [ordered]@{
            commit = "${{ github.sha }}"
            scenario = "benchmark-smoke"
            measured = $false
            reason = "smoke tests only; no server load run in this workflow"
            hardware = "github-actions-windows-latest"
            durationSeconds = $null
            tick = $null
            runtime = $null
            gc = $null
          }
          $artifact | ConvertTo-Json -Depth 8 | Set-Content artifacts/benchmark-smoke.json

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          path: artifacts/benchmark-smoke.json
