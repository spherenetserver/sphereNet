// CHATFLAGS - Chat system flags (Source-X CHATF_*).
//             Sohbet sistemi bayrakları (Source-X CHATF_*).
// Type / Tür: hex/integer (0x prefix required / 0x öneki gerekir)
//   0x01 AUTOJOIN          - auto-join the first static channel / ilk statik kanala katıl
//   0x02 CHANNELCREATION   - players may create channels / kanal oluşturma
//   0x04 CHANNELMODERATION - channel moderation / kanal moderasyonu
//   0x08 CUSTOMNAMES       - custom chat names / özel sohbet adları
//   0x10 GLOBALCHAT        - global chat (clients 7.0.62.2+) / genel sohbet (7.0.62.2+)
// Default / Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — GameClient.ServerChatFlags; SphereNet applies only 0x10
//     GLOBALCHAT, the other bits are only read back through SERV.CHATFLAGS.
//     SphereNet yalnızca 0x10 GLOBALCHAT'i uygular, diğer bitler yalnızca
//     SERV.CHATFLAGS ile okunur.
CHATFLAGS=0

// CHATSTATICCHANNELS - Chat channels that always exist (comma separated).
//                      Sohbet sisteminde her zaman var olan kanallar (virgülle).
// Type / Tür: string
// Default / Varsayılan: "General, Help, Trade, Looking For Group"
// [WORKING] / [ÇALIŞIYOR] — ChatEngine static channels / statik kanallar.
CHATSTATICCHANNELS=General, Help, Trade, Looking For Group

// ARRIVEDEPARTMSG - Player arrival/departure announcement.
//                   Oyuncu giriş/çıkış duyurusu.
// Type / Tür: integer
//   0 = off / kapalı
//   1 = announce to players / oyunculara duyur
//   2 = staff only / yalnızca görevlilere
// Default / Varsayılan: 1
// [WORKING] / [ÇALIŞIYOR] — GameClient login/logout.
ARRIVEDEPARTMSG=1

// CHARTAGS - Add tags such as [npc], [tame] to a character's name on single click.
//            Tek tıklamada karakter adına [npc], [tame] gibi etiketler ekle.
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 0 (a GM with AllShow sees them anyway / AllShow'daki GM zaten görür)
// [WORKING] / [ÇALIŞIYOR] — ClientInventoryHandler single-click label / tek tık etiketi.
CHARTAGS=0

// SUPPRESSCAPITALS - Lower-case a player's all-caps speech (longer than 5 letters).
//                    Oyuncunun tamamı büyük harfli konuşmasını küçült (5 harften uzun).
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — SpeechEngine.SuppressCapitals.
SUPPRESSCAPITALS=0

// SPEECHOTHER - A SPEECH list Source-X reads and keeps but never uses.
//               Source-X'in okuyup sakladığı ama hiç kullanmadığı SPEECH listesi.
// Type / Tür: string
// Default / Varsayılan: ""
// [READ ONLY] / [OKUNUYOR] — Only read back through SERV.SPEECHOTHER (Source-X does
//                            not use it either / Source-X de kullanmaz).
SPEECHOTHER=

// MEDIUMCANHEARGHOSTS - Spirit Speak value (tenths: 1000 = 100.0) at which the
//                       living understand ghost speech.
//                       Yaşayanların hayalet konuşmasını anladığı Spirit Speak
//                       değeri (onda birlik: 1000 = 100.0).
// Type / Tür: integer
// Default / Varsayılan: 1000
// [WORKING] / [ÇALIŞIYOR] — GhostSpeech.MediumCanHearGhosts.
MEDIUMCANHEARGHOSTS=1000

// EMOTEFLAGS - Who sees the automatic emotes (Source-X EMOTEF_*).
//              Otomatik emote'ları kimin gördüğü (Source-X EMOTEF_*).
// Type / Tür: hex/integer (0x prefix required / 0x öneki gerekir)
//   0x01 ATTACKER        - "%s is attacking %s!" only to the attacked character
//                          yalnızca saldırılan karaktere
//   0x02 POISON          - the poison emote only to the poisoned character
//                          zehir emote'unu yalnızca zehirlenen görür
//   0x04 DESTROY         - the item-destroy emote only to its owner
//                          eşya yok olma emote'u yalnızca sahibine
//   0x08 HIDE_EAT_PLAYER - no emote while players eat / oyuncu yerken emote yok
//   0x10 HIDE_EAT_NPC    - no emote while NPCs eat / NPC yerken emote yok
// Default / Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — Character.EmoteFlags; SphereNet applies only 0x02 POISON.
//                           SphereNet yalnızca 0x02 POISON'u uygular.
EMOTEFLAGS=0

// CONTEXTMENULIMIT - Most entries sent in one context menu.
//                    Bir bağlam (context) menüsünde gönderilen en fazla satır.
// Type / Tür: integer (0-255)
// Default / Varsayılan: 15
// [WORKING] / [ÇALIŞIYOR] — PacketContextMenu.EntryLimit.
CONTEXTMENULIMIT=15

// ============================================================================
// SCRIPTING & WORLD RULES / SCRIPT & DÜNYA KURALLARI
// ============================================================================

// MAXLOOPTIMES - Most iterations of a single script loop (WHILE/FOR...).
//                Tek bir script döngüsünün (WHILE/FOR...) en fazla tur sayısı.
// Type / Tür: integer (0 = unlimited / sınırsız)
// Default / Varsayılan: 100000 (the Source-X reference ini ships 10000 / referans ini 10000)
// [WORKING] / [ÇALIŞIYOR] — ScriptScope.DefaultMaxLoopIterations.
MAXLOOPTIMES=100000

// AREAFLAGS - What ROOMDEFs inherit from the AREA around them (Source-X AREAF_*).
//             ROOMDEF'lerin çevrelerindeki AREA'dan miras aldıkları (Source-X AREAF_*).
// Type / Tür: flags (Sphere rule / Sphere kuralı)
//   01 = EVENTS    02 = FLAGS    04 = TAGs / TAG'ler
// Default / Varsayılan: 02
// [WORKING] / [ÇALIŞIYOR] — GameWorld.ApplyRoomInheritance (once after the world loads
//                           / dünya yüklendikten sonra bir kez).
AREAFLAGS=02

// ADVANCEDLOS - Who uses the newer line-of-sight algorithm. A BIT MASK, not a
//               quality level (Source-X CServerConfig.h:474-476, CCharLOS.cpp:17).
//               Yeni görüş hattı (line-of-sight) algoritmasının kimde açık olduğu.
//               Kalite kademesi değil, BİT MASKESİ (Source-X CServerConfig.h:474-476,
//               CCharLOS.cpp:17).
// Type / Tür: integer bit mask (0-3)
//   0x00 DISABLED / KAPALI    0x01 PLAYER / OYUNCU    0x02 NPC    0x03 both / ikisi
// Default / Varsayılan: 0
// Note / Not: With the bit off that kind of viewer uses the old method: walking
//             square by square at foot level (Source-X CanSeeLOS, default); with it
//             on, a ray at eye level (CanSeeLOS_New).
//             Bit kapalıysa o tür bakan eski yöntemi kullanır: ayak hizasında kare
//             kare yürüme (Source-X CanSeeLOS, varsayılan); bit açıksa göz hizasında
//             ışın (CanSeeLOS_New).
// [WORKING] / [ÇALIŞIYOR] — GameWorld.AdvancedLos.
ADVANCEDLOS=0

// DISTANCEFORMULA - Distance calculation method (Source-X CServerConfig.h:479-481,
//                   CPointBase.cpp:151+).
//                   Mesafe hesaplama yöntemi.
// Type / Tür: integer (0-2)
//   0 = no diagonal, no Z — a SQUARE area around the object (UO standard)
//       köşegen yok, Z yok — nesne merkezde KARE bir alan (UO standardı)
//   1 = diagonal counted, no Z — a CIRCULAR area / köşegen sayılır, Z yok — DAİRESEL
//   2 = like 1, but every distance check also counts Z
//       1 gibi, ama her mesafe kontrolü Z'yi de hesaba katar
// Default / Varsayılan: 0
// Note / Not: The client's view range (GetDistSight) always stays square.
//             İstemci görüş alanı (GetDistSight) her zaman kare kalır.
// [WORKING] / [ÇALIŞIYOR] — Point3D.GetDistanceTo.
DISTANCEFORMULA=0

// FLIPDROPPEDITEMS - An item dropped on the ground turns to its flipped graphic.
//                    Never applied to an item that cannot be moved (Source-X
//                    CCharAct.cpp:3266).
//                    Yere bırakılan eşya çevrilmiş grafiğine döner. Taşınamayan
//                    eşyaya asla uygulanmaz (Source-X CCharAct.cpp:3266).
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 1
// [WORKING] / [ÇALIŞIYOR] — Item.FlipDroppedItems.
FLIPDROPPEDITEMS=1

// CANUNDRESSPETS - Let an owner take off what their pet is WEARING. Most of the
//                  rule is OWNERSHIP anyway: an owner can always reach into the
//                  pet's PACK; this key only says whether they may also strip what
//                  it wears (CCharAct.cpp:2957). Neither is open to anyone else.
//                  Before 2026-09-14 this gate read "unless another PLAYER", so every
//                  NPC in the world was open to everyone — a stranger's dragon's armour
//                  included.
//                  Sahibinin petinin ÜZERİNDEKİ eşyayı çıkarmasına izin ver. Kuralın
//                  büyük kısmı zaten SAHİPLİK: sahip petinin ÇANTASINA her halükârda
//                  uzanabilir; bu anahtar yalnızca petin GİYDİĞİNİ de çıkarabilir mi
//                  onu söyler (CCharAct.cpp:2957). Hiçbiri başkasına açık değildir.
//                  2026-09-14 öncesinde bu kapı "başka bir OYUNCU değilse" diye
//                  yazılmıştı, yani dünyadaki her NPC herkese açıktı — bir yabancının
//                  ejderhasının zırhı dahil.
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 1
// [WORKING] / [ÇALIŞIYOR] — Character.CanUndressPets.
CANUNDRESSPETS=1

// CANPETSDRINKPOTION - A pet drinks a potion dropped on it. While off the bottle
//                      goes into the pet's pack like any other gift
//                      (CCharNPCAct.cpp:2145). The way to heal a wounded animal in
//                      the middle of a fight.
//                      Petin üstüne bırakılan iksiri içmesi. Kapalıyken şişe, diğer
//                      her hediye gibi petin çantasına gider (CCharNPCAct.cpp:2145).
//                      Yaralı bir hayvanı dövüş ortasında iyileştirmenin yolu.
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 1
// [WORKING] / [ÇALIŞIYOR] — Character.CanPetsDrinkPotion.
CANPETSDRINKPOTION=1

// VENDORMARKUP - A vendor's profit margin in percent, when nothing more specific
//                says otherwise. Order: the vendor's own TAG -> the region's TAG ->
//                this (CCharNPCStatus.cpp:366). 1 = no markup. 0 = shopping is FREE
//                — the reference ini's own warning.
//                Satıcının kâr marjı yüzdesi (daha özel bir şey söylenmediğinde).
//                Sıra: satıcının kendi TAG'i -> bölgenin TAG'i -> bu
//                (CCharNPCStatus.cpp:366). 1 = marj yok. 0 = alışveriş BEDAVA —
