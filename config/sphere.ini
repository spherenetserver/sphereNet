// ============================================================================
// SphereNet Configuration File - Source-X compatible (counterpart of CServerConfig)
//
// One line per key below. The full reference - types, defaults, examples, notes -
// is docs/CONFIG-EN.md (English) and docs/CONFIG-TR.md (Turkce) in the repository.
//
// KEY=VALUE; key names are case-insensitive. // starts a comment anywhere on a
// line, so a value can never contain "//" (no https:// in a URL).
// Numbers: most keys are decimal (hex needs 0x); flag keys follow the Sphere rule
// (leading zero = hex, values OR'ed with |). The reference lists which is which.
// Boolean: 1, true or yes = on; anything else (including 0 and 2) = off.
//
// Status tags: [WORKING] used by the engine. [READ ONLY] loaded but changes no
// game behaviour (at most SERV.<KEY> reads it back). [NOT IMPLEMENTED] not even
// loaded, kept for Source-X ini compatibility; listed at startup as "not read by
// this engine".
// "Default" is the engine's own value when the key is absent; the value set in
// this file may differ from it on purpose.
// ============================================================================

[SPHERE]

// ============================================================================
// DEBUG & LOGGING
// ============================================================================

// DEBUGPACKETS - Dump packet traffic to console/log, console level Debug; panel toggle.
// Default: 0. [WORKING]
DebugPackets=0

// SCRIPTDEBUG - Log script execution traces; panel toggle. Default: 0. [WORKING]
ScriptDebug=0

// DEBUGPACKETOPCODES - Packet debug filter: hex opcodes, comma separated; empty = all
// (except 0x73 ping). Default: "" (all). [WORKING]
DebugPacketOpcodes=22,34,BF

// DEBUGPACKETCATEGORIES - Packet kinds the debug log keeps: player,npc,item,packet
// (comma separated); empty = all. Default: "". [WORKING]
DebugPacketCategories=

// LOGFILELEVEL - Level filter for logs/spherenet-*.log: one level = minimum threshold,
// or a | / comma list = only those levels. Verbose Debug Information Warning Error Fatal.
// Default: Warning. [WORKING]
LogFileLevel=Warning

// ============================================================================
// PERFORMANCE & MULTICORE
// ============================================================================

// TICKSLEEPMODE - How the main loop yields the CPU between ticks.
// 0=spin 1=sleep 2=hybrid 3=adaptive. Default: 3. [WORKING]
TickSleepMode=3

// ASYNCRECEIVE - Connection receive path: 1=completions, 0=polled (Socket.Select).
// Default: 1. [WORKING]
AsyncReceive=1

// SLOWTICKWARNMS / LOOPSTALLWARNMS - Log [slow_tick] / [loop_stall] above these ms;
// 0 = off. Default: 50 / 100. [WORKING]
SlowTickWarnMs=50
LoopStallWarnMs=100

// SLOWPACKETWARNMS - Log [slow_packet] when one inbound packet handler exceeds this (ms);
// 0 = off. Default: 20. [WORKING]
SlowPacketWarnMs=20

// The multicore tick pipeline (parallel Build -> serial Apply) is always on.

// MULTICOREWORKERCOUNT - Worker threads for parallel phases; 0 = ProcessorCount.
// Default: 0. [WORKING]
MulticoreWorkerCount=0

// MULTICOREPHASETIMEOUTMS - Timeout of one multicore phase (ms, min 100); on overrun
// the tick falls back to a single thread. Default: 5000. [WORKING]
MulticorePhaseTimeoutMs=5000

// MAXNPCSPERTICK - Due NPC actions processed per tick; rest deferred. Default: 500. [WORKING]
MaxNpcsPerTick=500

// NPCPATHPRESTAGEPERTICK - Prestage A* path searches accepted per tick. Default: 8. [WORKING]
NpcPathPrestagePerTick=8

// PLAYERBOTS - Server-driven player characters (saved, resumed after restart; not counted as clients). Default: 0. [WORKING]
PlayerBots=0

// PLAYERBOTCOUNT - Bot population the server fills up to (bots in the save first). Default: 300. [WORKING]
PlayerBotCount=300

// PLAYERBOTDATADIR - Bot data: nav/, chat/<lang>/, archetypes.txt, scripts/*.scp. Default: playerbots/. [WORKING]
PlayerBotDataDir=playerbots/

// PLAYERBOTLANGUAGE - Bot chat language under chat/ (en, tr); missing lines fall back to en. Default: en. [WORKING]
PlayerBotLanguage=en

// PLAYERBOTREDRESPAWN - Region (AREADEF name) a dead murderer bot is raised at (a player killer bot at its own haunt); others at the nearest town healer. Default: Delucia. [WORKING]
PlayerBotRedRespawn=Delucia

// PLAYERBOTRECLAIMRANGE - A raised bot walks back to a corpse within this many tiles; a farther one is handed back to it. Default: 40. [WORKING]
PlayerBotReclaimRange=40

// PLAYERBOTGRAVITY - Percent of a bot's town trips that go to a place near a connected player (0 = none). Default: 40. [WORKING]
PlayerBotGravity=40

// PLAYERBOTCROWD - Bots around one player beyond which no more are drawn toward them. Default: 14. [WORKING]
PlayerBotCrowd=14

// PLAYERBOTCHATPACE - Mean seconds between two bot scenes (a line, a trade haggle, news) played near each player. Default: 30. [WORKING]
PlayerBotChatPace=30

// PLAYERBOTNAMEPREFIX - Put before every bot's name as players see it (quote it to keep the trailing space); empty for none. Default: "[Bot] ". [WORKING]
PlayerBotNamePrefix="[Bot] "

// PLAYERBOTPKPERCENT - Percent of fighter bots that are player killers: each keeps to a haunt outside the guard zones, attacks every blue player or bot it sees there and is raised at the haunt with a new kit when killed. 0 = none. Default: 5. [WORKING]
PlayerBotPkPercent=5

// PLAYERBOTPKRESPAWNSEC - Seconds before a killed player killer bot is raised at its haunt (one to two times this, at random); it waits as an unseen ghost. 0 = at once. Default: 180. [WORKING]
PlayerBotPkRespawnSec=180

// PLAYERBOTPKSPARESKILL - A player killer bot leaves alone anyone whose skill total (in points) is under this: new players. 0 = nobody is spared. Default: 300. [WORKING]
PlayerBotPkSpareSkill=300

// PLAYERBOTPKSPAREMINUTES - Minutes a player or bot killed by a player killer bot is left alone by all of them (no camping the resurrected). 0 = never. Default: 10. [WORKING]
PlayerBotPkSpareMinutes=10

// PLAYERBOTUNSEENLIFTSEC - Seconds a bot lift (stuck, stranded, a map with no roads, a player killer back to its haunt) waits while a player can see where the bot stands or would appear; then it goes ahead. New bots also log in, and surplus ones log out, where nobody sees. 0 = lift at once. Default: 90. [WORKING]
PlayerBotUnseenLiftSec=90

// PLAYERBOTTHIEFPERCENT - Percent of the other bots that are thieves (snoop and steal in town crowds). 0 = none. Default: 5. [WORKING]
PlayerBotThiefPercent=5
// PLAYERBOTPATHSEARCHESPERTICK - Tile path searches for bots run per tick, together, in the tick's parallel phase (a bot walking into a wall or a crowd asks for one). 0 = none (bots walk walls by hand). Default: 16. [WORKING]
PlayerBotPathSearchesPerTick=16

// MULTICOREDETERMINISMDEBUG - Log a SHA-256 world hash each tick (first 2000 ticks).
// Default: 0. [WORKING]
MulticoreDeterminismDebug=0

// MULTICOREDETERMINISMEXPECTEDHASH - Expected determinism hash; mismatch warns;
// empty = no comparison. Default: "". [WORKING]
MulticoreDeterminismExpectedHash=

// ============================================================================
// SERVER IDENTITY, PANEL & HOST
// ============================================================================

// SERVNAME - Name shown in the server list and on the status page.
// Default: "SphereNet". [WORKING]
SERVNAME=SphereNet

// SERVPORT - Game server TCP port (telnet +1, web status +2, panel +3).
// Default: 2593. [WORKING]
SERVPORT=2593

// SERVIP - IP advertised to clients in 0xA8/0x8C (not the listen address).
// Default: "0.0.0.0" (incoming local address, else 127.0.0.1). [WORKING]
// SERVIP=0.0.0.0

// SERVERLIST - Extra shards on the login list: "name,ip,port" entries, ';' separated.
// Default: "" (only this shard). [WORKING]
// SERVERLIST=Test Shard,192.168.1.10,2593;Event Shard,192.168.1.11,2594

// URL - Shard website, given to scripts as SERV.URL (no scheme: "//" is a comment).
// Default: "www.spherenetserver.com". [WORKING]
// URL=www.myshard.com

// ADMINEMAIL - Administrator e-mail, given to scripts as SERV.ADMINEMAIL.
// Default: "". [READ ONLY]
// ADMINEMAIL=

// ADMINPASSWORD - Telnet admin console and web panel password; empty disables telnet
// admin. Default: "1234" when absent. [WORKING]
ADMINPASSWORD=

// ADMINPANELAUTOFILL - Pre-fill ADMINPASSWORD on the panel login (localhost, plain text
// only); local development only. Default: 0. [WORKING]
ADMINPANELAUTOFILL=0

// ADMINPANELPORT - Web panel port; 0 = SERVPORT+3. Default: 0. [WORKING]
ADMINPANELPORT=9999

// ADMINPANELALLOWEDHOSTS - Host names the panel answers to (comma separated); "*" = any.
// Default: "" (localhost, 127.0.0.1, ::1). [WORKING]
ADMINPANELALLOWEDHOSTS=

// PLUGINBRIDGEPORT - TCP port for out-of-process plugins (docs/PLUGINS.md); 0 = off.
// Default: 0. [WORKING]
PLUGINBRIDGEPORT=0

// PLUGINBRIDGETOKEN - Secret a plugin sends to connect; the bridge stays off without one.
// Cannot contain "//". Default: "". [WORKING]
PLUGINBRIDGETOKEN=

// PLUGINBRIDGEADDRESS - Address the plugin bridge listens on. Default: 127.0.0.1. [WORKING]
PLUGINBRIDGEADDRESS=127.0.0.1

// PUBLICPAPERDOLL - Serve /public/paperdoll/<serial>.png and .json without login.
// Default: 0. [WORKING]
PUBLICPAPERDOLL=0

// PUBLICPAPERDOLLORIGINS - CORS origins allowed to fetch the public paperdoll (comma
// separated, domain only); "*" = any. Default: "". [WORKING]
PUBLICPAPERDOLLORIGINS=

// SCRIPTPACKREPO - GitHub script pack (owner/name) for the panel Scripts "Install" button.
// Default: Sphereserver/Scripts-X. [WORKING]
SCRIPTPACKREPO=Sphereserver/Scripts-X

// SCRIPTPACKBRANCH - Script pack branch to download. Default: main. [WORKING]
SCRIPTPACKBRANCH=main

// HOSTAUTOSTART - SphereNet.Host starts the game server on its own start.
// Default: 1. [WORKING]
HOSTAUTOSTART=1

// HOSTRESTARTONCRASH - Host restarts a crashed server (backoff; stops after 5 crashes
// in 10 min). Default: 1. [WORKING]
HOSTRESTARTONCRASH=1

// HOSTSHUTDOWNQUIETMS - Silence (ms) after which a shutting-down server is killed as
// stuck (1000-600000). Default: 20000. [WORKING]
HOSTSHUTDOWNQUIETMS=20000

// HOSTSHUTDOWNTIMEOUTMS - Absolute shutdown ceiling (ms, 1000-3600000).
// Default: 180000. [WORKING]
HOSTSHUTDOWNTIMEOUTMS=180000

// ============================================================================
// UPDATES FROM THE PANEL (Updates page)
// ============================================================================
// APPUPDATE* = panel one-click update from prebuilt CI binaries.
// APPUPDATEREPODIR = update.cmd build-from-source flow (server stopped).

// APPUPDATEREPO - GitHub repo ("owner/name") updates come from; empty = update system off.
// Default: "". [WORKING]
APPUPDATEREPO=spherenetserver/sphereNet

// APPUPDATECHANNEL - Release tag the packages hang on. Default: nightly. [WORKING]
APPUPDATECHANNEL=nightly

// APPUPDATERUNTIME - Package platform (RID): asset spherenet-<RID>.zip.
// Default: win-x64. [WORKING]
APPUPDATERUNTIME=win-x64

// APPUPDATECHECKMINUTES - Background new-version check interval (min); 0 = manual only.
// Default: 15. [WORKING]
APPUPDATECHECKMINUTES=15

// APPUPDATETOKEN - Optional GitHub token, only for a private repo. Default: "". [WORKING]
APPUPDATETOKEN=

// APPUPDATEREPODIR - Git clone folder used by update.cmd/update.ps1 only (relative to
// sphere.ini); empty when the working folder is the repo. Default: "". [WORKING]
APPUPDATEREPODIR=

// ============================================================================
// CLIENT & CONNECTION
// ============================================================================

// CLIENTERA - Client profile used until the client reports its version.
// 0/Sphere56x=old Sphere 56x packet formats  1/Modern=ClassicUO/7.x. Default: Modern. [WORKING]
ClientEra=Sphere56x

// CLIENTVERSION - Expected client version string (e.g. 4.0.2, 5.0.9.1, 7.0.96.5).
// Default: 4.0.2. [READ ONLY]
CLIENTVERSION=7.0.96.5

// CLIENTMAX - Maximum clients connected at the same time (0 or less = 256). Default: 256.
// [WORKING]
CLIENTMAX=1100

// CLIENTMAXIP - Maximum connections from one IP (0 = unlimited). Default: 16. [WORKING]
CLIENTMAXIP=16

// CLIENTLINGER - Seconds a character stays in the world after its connection drops without
// a safe logout (0 = leave at once). Default: 600. [WORKING]
CLIENTLINGER=300

// CONNECTINGMAX - Maximum clients in the pre-login stage. Default: 32. [READ ONLY]
CONNECTINGMAX=32

// CONNECTINGMAXIP - Maximum not-yet-in-game connections per IP (0 = unlimited).
// Default: 8. [WORKING]
CONNECTINGMAXIP=8

// USECRYPT - Accept encrypted (Blowfish/Twofish) login; 0 = unencrypted clients only.
// Default: 1. [WORKING]
USECRYPT=1

// USENOCRYPT - Also accept unencrypted connections alongside encrypted ones. Default: 0.
// [WORKING]
USENOCRYPT=1

// COLORNOTO* - Overhead name hue per notoriety (always hex; 0 = built-in default).
// Default: the values below. [WORKING]
// COLORNOTOGOOD=063              // blue (innocent)
// COLORNOTOGOODNPC=063           // blue (innocent NPC)
// COLORNOTOGUILDSAME=044         // green (ally)
// COLORNOTONEUTRAL=03b2          // grey (can be attacked)
// COLORNOTOCRIMINAL=03b2         // grey (criminal)
// COLORNOTOGUILDWAR=02b          // orange (enemy guild)
// COLORNOTOEVIL=026              // red (murderer)
// COLORNOTOINVUL=035             // yellow (invulnerable)
// COLORNOTOINVULGAMEMASTER=0b    // purple (GM)
// COLORNOTODEFAULT=03b2          // grey (anything else)

// COLOREMOTE - Hue of engine emote lines (hex). Default: 022. [WORKING]
// COLOREMOTE=022

// COLORINVISITEM - Hue in which a GM sees an invisible item (hex). Default: 1000.
// [READ ONLY]
ColorInvisItem=1000

// COLORINVIS / COLORINVISSPELL / COLORHIDDEN - Non-zero switches off the client's grey
// overlay for GM-invisible / invisibility-spell / hidden characters. Default: 0. [WORKING]
ColorInvis=0
ColorInvisSpell=0
ColorHidden=0

// PETSINHERITNOTORIETY - Notoriety flags a pet inherits from its owner (hex flags).
// Default: 0. [READ ONLY]
PetsInheritNotoriety=0

// ============================================================================
// EXPANSION FLAGS (EXPANSION SUPPORT)
// ============================================================================
// 0 = off, hex bitmask = on. All FEATURE* keys are OR'ed into the 0xB9 login packet.

// FEATURET2A - The Second Age (1998) capability mask. Default: 0x1. [WORKING]
FEATURET2A=0x3

// FEATURELBR - Lord Blackthorn's Revenge (2002) mask. Default: 0. [WORKING]
FEATURELBR=0x3

// FEATUREAOS - Age of Shadows (2003) mask; bit 0x02 also enables AOS combat. Default: 0.
// [WORKING]
FEATUREAOS=0xF

// FEATURESE - Samurai Empire (2004) mask; bit 0x02 enables the SE parry formula.
// Default: 0. [WORKING]
FEATURESE=0x3

// FEATUREML - Mondain's Legacy (2005) mask. Default: 0. [WORKING]
FEATUREML=0x1

// FEATUREKR - Kingdom Reborn client support (2007). Default: 0. [WORKING]
FEATUREKR=0

// FEATURESA - Stygian Abyss (2009) mask. Default: 0. [WORKING]
FEATURESA=0x3

// FEATURETOL - Time of Legends (2015) mask, incl. the virtual gold bit. Default: 0. [WORKING]
FEATURETOL=0x1

// FEATUREEXTRA - Custom extra expansion bits. Default: 0. [WORKING]
FEATUREEXTRA=0

// RACIALFLAGS - Racial abilities, Source-X RACIALF_* (0x prefix; leading zero is not hex).
// Default: 0. [WORKING]
RACIALFLAGS=0

// ERALIMITGEAR / ERALIMITLOOT / ERALIMITPROPS - Era (RESDISP 0-9, 9 = ToL) of gear, loot and
// item properties for CHARDEFs without their own. Default: 9. [WORKING]
ERALIMITGEAR=9
ERALIMITLOOT=9
ERALIMITPROPS=9

// DECIMALVARIABLES - Numeric TAG/VAR/LOCAL/CTAG read-back and save: 0 = Sphere hex,
// 1 = decimal. Default: 0. [WORKING]
DECIMALVARIABLES=0

// DISPLAYELEMENTALRESISTANCE - Show elemental resists in the status packet even with
// COMBATFLAGS ELEMENTALENGINE off. Default: 0. [WORKING]
DISPLAYELEMENTALRESISTANCE=0

// OPTIONFLAGS - Extra server option flags, Source-X OF_* (0x prefix required; define once).
// 0x80 FileCommands (FILE.*), 0x2000 Buffs. Default: 0. [WORKING]
OPTIONFLAGS=0x2080

// ============================================================================
// MAP CONFIGURATION
// ============================================================================
// Format: MAP<id>=width,height,sectorSize,mulReadIndex,clientMapId (MAP0..MAP255;
// MAPn= disables a map). Default when no MAPn is given: MAP0=6144,4096,64,0,0.

// MAP0 / MAP1 - Map definitions; 7168 is the full map0 width incl. the T2A/Lost Lands.
// [WORKING]
MAP0=7168,4096,64,0,0
MAP1=7168,4096,64,1,1
// MAP2=2304,1600,64,2,2
// MAP3=2560,2048,64,3,3
// MAP4=1448,1448,64,4,4
// MAP5=1280,4096,64,5,5

// USEMAPDIFFS - Apply the mapdif*/stadif* patch files over the maps. Default: 0. [WORKING]
USEMAPDIFFS=0

// ============================================================================
// FILE PATHS
// ============================================================================
// Relative paths are resolved from the working directory, then the server executable's.

// MULFILES - Directory of the UO client data files (map*.mul, statics*.mul ...).
// Default: "" (look for a "mul" folder). [WORKING]
MULFILES=mul/

// SCPFILES - Directory of the server scripts (.scp). Default: scripts/. [WORKING]
SCPFILES=scripts/

// SCRIPTENCODING - Script text encoding: AUTO | UTF8 | LEGACY. Default: AUTO. [WORKING]
SCRIPTENCODING=AUTO

// SCRIPTLEGACYCODEPAGE - Windows code page for LEGACY and the AUTO fallback (1254 = old
// Turkish scripts). Default: 1252. [WORKING]
SCRIPTLEGACYCODEPAGE=1252

// LOG - Log output directory. Default: logs/. [WORKING]
LOG=logs/

// WORLDSAVE - Directory of the world save files. Default: save/. [WORKING]
WORLDSAVE=save/

// ACCTFILES - Directory of the account files (sphereaccu.scp). Default: accounts/. [WORKING]
ACCTFILES=accounts/

// ============================================================================
// SAVE SETTINGS
// ============================================================================

// SAVEPERIOD - Automatic save interval in minutes (0 = no automatic save). Default: 20.
// [WORKING]
SAVEPERIOD=20

// FORCEGARBAGECOLLECT - Check/clean up world objects before every save (not the .NET GC).
// Default: 1. [WORKING]
FORCEGARBAGECOLLECT=1

// SAVEONSHUTDOWN - Save the world on a clean shutdown. Default: 1. [WORKING]
SAVEONSHUTDOWN=1

// SAVESECTORSPERTICK - Source-X: sectors saved per tick in a background save. Default: 1.
// [READ ONLY]
SAVESECTORSPERTICK=1

// SAVESTEPMAXCOMPLEXITY - Source-X: max object complexity per background-save step.
// Default: 500. [READ ONLY]
SAVESTEPMAXCOMPLEXITY=500

// SAVEBACKGROUND - 0 = synchronous save (world pauses), >0 = snapshot + background worker.
// Default: 0. [WORKING]
SAVEBACKGROUND=1

// BACKUPLEVELS - Backup save generations kept (save_1/, save_2/ ...; 0 = none). Default: 10.
// [WORKING]
BACKUPLEVELS=5

// SAVEFORMAT - Save file format: 0/Text  1/TextGz  2/Binary  3/BinaryGz. Default: Text.
// [WORKING]
SAVEFORMAT=Text

// SAVESHARDS - 0 = single file, 1 = size-based rolling (SAVESHARDSIZEMB), 2-16 = fixed
// parallel hash shards. Default: 3. [WORKING]
SAVESHARDS=3

// SAVESHARDSIZEMB - Max size per file in rolling mode, MB (SAVESHARDS=1 only). Default: 75.
// [WORKING]
SAVESHARDSIZEMB=75

// ============================================================================
// WORLD TIMING
// ============================================================================

// GAMEMINUTELENGTH - Real seconds per in-game minute (8 = 24h day ~3.2 real hours).
// Default: 20. [WORKING]
GAMEMINUTELENGTH=8

// SERVERTICKMS - World-loop tick interval in ms, clamped 20-250. Default: 100. [WORKING]
ServerTickMs=100

// TICKPERIOD - Server ticks per second; only used when SERVERTICKMS is absent.
// Default: 10. [WORKING]
// TICKPERIOD=10

// SECTORSLEEP - Minutes a sector keeps ticking after its last player leaves (0 = a woken
// sector never sleeps; not the Source-X meaning). Default: 10. [WORKING]
SECTORSLEEP=1

// TIMERCALL - Interval of the server timer hook (f_onserver_timer); unit per TIMERCALLUNIT.
// Default: 0 (off). [WORKING]
TIMERCALL=0

// TIMERCALLUNIT - Unit of TIMERCALL: 0=minutes 1=seconds. Default: 0. [WORKING]
TIMERCALLUNIT=0

// MAPCACHETIME - Seconds map data blocks stay cached (0 = no cache). Default: 120.
// [NOT IMPLEMENTED]
MAPCACHETIME=120

// ZEROPOINT - Sextant coordinate origin "x,y[,z[,m]]". Default: 1323,1624,0. [WORKING]
ZEROPOINT=1323,1624,0

// ============================================================================
// VIEW RANGE & DISTANCE
// ============================================================================

// MAPVIEWSIZE - Default client view range (tile radius, 1-255). Default: 18. [WORKING]
MAPVIEWSIZE=18

// MAPVIEWSIZEMAX - Largest view range a client may request (5-255). Default: 24. [WORKING]
MAPVIEWSIZEMAX=24

// MAPVIEWRADAR - Tiles within which combat memory / NPC pursuit stay valid (0 = MAPVIEWSIZE).
// Default: 31. [WORKING]
MAPVIEWRADAR=0

// DISTANCEWHISPER / DISTANCETALK / DISTANCEYELL - Hearing range (tiles) of whisper, speech,
// yell. Default: 3 / 18 / 31. [WORKING]
DISTANCEWHISPER=3
DISTANCETALK=18
DISTANCEYELL=48

// MAXCOMPLEXITY - Characters per sector before it counts as too complex. Default: 32. [WORKING]
MAXCOMPLEXITY=32

// MAXSECTORCOMPLEXITY - Ground items per sector before a warning. Default: 1024. [WORKING]
MAXSECTORCOMPLEXITY=1024

// ============================================================================
// STATS & SKILLS
// ============================================================================

// MAXBASESKILL - Upper bound of Source-X's random start skill value, in tenths (not a skill
// cap). Default: 200. [READ ONLY]
MAXBASESKILL=200

// MAXPOLYSTATS - Max points a polymorph may move STR/DEX (with MAGICFLAGS POLYMORPHSTATS).
// Default: 150. [WORKING]
MAXPOLYSTATS=150

// MAXFAME - Maximum fame a character can have. Default: 10000. [WORKING]
MAXFAME=10000

// MAXKARMA - Maximum (best) karma. Default: 10000. [WORKING]
MAXKARMA=10000

// MINKARMA - Minimum (worst) karma. Default: -10000. [WORKING]
MINKARMA=-10000

// STATSFLAGS - Refuse MAXHITS/MAXMANA/MAXSTAM writes: 01=everyone 02=players 04=NPCs.
// Default: 0. [WORKING]
STATSFLAGS=0

// EXPERIENCESYSTEM - Source-X experience (EXP) system on/off. Default: 0. [WORKING]
EXPERIENCESYSTEM=0

// EXPERIENCEMODE - EXP gain flags (0 freezes EXP): 01=combat 02=craft 04=may go down
// 08=never below level 010=auto EXP/LEVEL for NPCs. Default: 0. [WORKING]
EXPERIENCEMODE=0

// EXPERIENCEKOEFPVP / EXPERIENCEKOEFPVM - Percent of experience from PvP / PvM kills.
// Default: 100. [WORKING]
EXPERIENCEKOEFPVP=100
EXPERIENCEKOEFPVM=100

// LEVELSYSTEM - Compute LEVEL from experience. Default: 0. [WORKING]
LEVELSYSTEM=0

// LEVELMODE - 0=linear 1=doubling (LEVELNEXTAT * (level+1)). Default: 1. [WORKING]
LEVELMODE=1

// LEVELNEXTAT - Experience needed for the next level (0 = no level). Default: 0. [WORKING]
LEVELNEXTAT=0

// ============================================================================
// REGENERATION
// ============================================================================
// Seconds to regain one point (REGEN0=hits, REGEN1=mana, REGEN2=stamina, REGEN3=food).
// REGEN0=40 = one HP every 40 seconds. A character's own REGENHITS/REGENMANA/...
// values override these.

// REGEN0 - Hit point regeneration interval (seconds). Default: 40. [WORKING]
REGEN0=40

// REGEN1 - Mana regeneration interval (seconds). Default: 20. [WORKING]
REGEN1=20

// REGEN2 - Stamina regeneration interval (seconds). Default: 10. [WORKING]
REGEN2=10

// REGEN3 - Hunger: seconds for food to drop one point. Default: 3600. [WORKING]
REGEN3=3600

// ============================================================================
// COMBAT
// ============================================================================

// COMBATFLAGS - Combat bit flags (Source-X COMBAT_*); 0x prefix required. Default: 0.
// [WORKING]
COMBATFLAGS=0

// COMBATDAMAGEERA - Damage formula era: 0=Sphere custom 1=pre-AOS 2=AOS. Default: 0. [WORKING]
COMBATDAMAGEERA=0

// COMBATHITCHANCEERA - Hit chance era: 0=Sphere custom 1=pre-AOS 2=AOS. Default: 0. [WORKING]
COMBATHITCHANCEERA=0

// COMBATHITCHANCELEGACYERA0 - 1 = old era-0 hit roll rand(chance), HCI/DCI ignored.
// Default: 0. [WORKING]
COMBATHITCHANCELEGACYERA0=0

// COMBATSPEEDERA - Swing speed era: 0=Sphere custom 1=pre-AOS 2=AOS 3=SE 4=ML. Default: 0.
// [WORKING]
COMBATSPEEDERA=0

// COMBATPARRYINGERA - Parry flags: 01=pre-SE 02=SE 010=shield 020=one-hand 040=two-hand
// 080=AR scaling; 0 = nobody can parry. Default: 01|010. [WORKING]
COMBATPARRYINGERA=01|010

// COMBATARCHERYMOVEMENTDELAY - Archer delay after moving, tenths of a second (0 = none).
