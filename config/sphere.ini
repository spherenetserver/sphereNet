// ============================================================================

// WALKBUFFER - Capacity of the movement token bucket (the allowed burst of steps).
//              A guard against speed hacks: every accepted step spends one token and
//              an empty bucket refills at WALKREGEN. Very low values (e.g. 2) choke a
//              running player: steps are rejected as walk_buffer and the client
//              snaps back ("stutter/rubber-band").
//              Hareket jeton kovasının kapasitesi (izin verilen ani adım patlaması).
//              Hız hilesine karşı tampon: kabul edilen her adım 1 jeton harcar, boş
//              kova WALKREGEN hızında dolar. Çok düşük değerler (örn. 2) koşan
//              oyuncuyu boğar: adımlar walk_buffer ile reddedilir ve istemci geri
//              sıçrar ("takılma/rubber-band").
// Type / Tür: integer (tokens, at least 1 / jeton, en az 1; below 5 = startup warning
//             / 5'in altı açılışta uyarı)
// Default / Varsayılan: 75
// Note / Not: In Source-X this key is a time in tenths of a second; SphereNet reads
//             it as a token count.
//             Source-X'te bu anahtar saniyenin onda biri cinsinden bir süredir;
//             SphereNet jeton sayısı olarak okur.
// [WORKING] / [ÇALIŞIYOR] — GameClient.WalkBufferMax (token-bucket movement gate).
WALKBUFFER=75

// WALKREGEN - Movement tokens regained PER SECOND (a RATE, not a period). A running
//             player needs ~5 steps/s, so it must be at least that (25 leaves ample
//             room). Low values like 1 lock movement to one step per second.
//             Saniyede yenilenen hareket jetonu (RATE, periyot DEĞİL). Koşan oyuncu
//             ~5 adım/sn ister; değer en az o kadar olmalı (25 bol pay bırakır).
//             1 gibi düşük değerler saniyede 1 adıma kilitler.
// Type / Tür: integer (tokens per second / saniyede jeton; below 5 = startup warning
//             / 5'in altı açılışta uyarı)
// Default / Varsayılan: 25
// [WORKING] / [ÇALIŞIYOR] — GameClient.WalkRegenPerSecond.
WALKREGEN=25

// WALKDELAYFOOT / WALKDELAYMOUNT / RUNDELAYFOOT / RUNDELAYMOUNT - Shortest time (ms)
//     between walking/running steps on foot/mounted. Must match the client's own
//     step pace; the next step is accepted (value - 30 ms) later.
//     Yaya/binekli yürüme ve koşma adımları arasındaki en kısa süre (ms).
//     İstemcinin kendi adım hızıyla aynı olmalıdır; sonraki adım (değer - 30 ms)
//     sonra kabul edilir.
// Type / Tür: integer (ms; WALKDELAYFOOT 0 or less = startup warning / 0 veya altı uyarı)
// Default / Varsayılan: 400 / 200 / 200 / 100 (the client's speeds / istemci hızları)
// [WORKING] / [ÇALIŞIYOR] — MovementEngine.GetMoveDelay (movement rate limit / hız sınırı).
WALKDELAYFOOT=400
WALKDELAYMOUNT=200
RUNDELAYFOOT=200
RUNDELAYMOUNT=100

// MOVEMENTCREDITENABLED - Credit-based movement system instead of the token bucket
//                         (opt-in). While on, MOVEMENTCREDIT* replace WALKBUFFER/WALKREGEN.
//                         Jeton kovası yerine kredi tabanlı hareket sistemi (isteğe
//                         bağlı). Açıkken WALKBUFFER/WALKREGEN yerine MOVEMENTCREDIT*
//                         kullanılır.
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — ClientCombatHandler movement gate / hareket geçidi.
MOVEMENTCREDITENABLED=0

// MOVEMENTCREDITBASEMS - Base cost of one step in the credit system (ms).
//                        Kredi sisteminde bir adımın temel maliyeti (ms).
// Type / Tür: integer (ms; below 50 = startup warning / 50'nin altı uyarı)
// Default / Varsayılan: 200
// [WORKING] / [ÇALIŞIYOR] — only while MOVEMENTCREDITENABLED=1 / yalnızca açıkken.
MOVEMENTCREDITBASEMS=200

// MOVEMENTCREDITMAXMS - Most time the credit bucket can save up (ms).
//                       Kredi kovasının biriktirebileceği en fazla süre (ms).
// Type / Tür: integer (ms)
// Default / Varsayılan: 1400
// [WORKING] / [ÇALIŞIYOR] — only while MOVEMENTCREDITENABLED=1 / yalnızca açıkken.
MOVEMENTCREDITMAXMS=1400

// MOVEMENTQUEUECAPACITY - Length of the queue holding steps that arrive early.
//                         Erken gelen adımların bekletildiği kuyruğun boyu.
// Type / Tür: integer (above 50 may hide speed hacks, startup warning)
//             integer (50'nin üstü hız hilesini gizleyebilir, açılışta uyarı)
// Default / Varsayılan: 10
// [WORKING] / [ÇALIŞIYOR] — MovementQueueProcessor.
MOVEMENTQUEUECAPACITY=10

// SPEEDHACKDETECTIONENABLED - Speed-hack detection from the movement history.
//                             Hareket geçmişinden hız hilesi tespiti.
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — ClientCombatHandler / SpeedHackDetector.
SPEEDHACKDETECTIONENABLED=0

// SPEEDHACKRATETHRESHOLD - How many times the expected step rate counts as a violation.
//                          Beklenen adım hızının kaç katının ihlal sayıldığı.
// Type / Tür: decimal number with a dot (1.5) / noktalı ondalık sayı (1.5)
// Default / Varsayılan: 1.5
// [WORKING] / [ÇALIŞIYOR] — only while SPEEDHACKDETECTIONENABLED=1 / yalnızca açıkken.
SPEEDHACKRATETHRESHOLD=1.5

// SPEEDHACKBURSTWINDOW - Consecutive steps looked at in the rate calculation.
//                        Hız hesabında bakılan ardışık adım sayısı.
// Type / Tür: integer
// Default / Varsayılan: 3
// [WORKING] / [ÇALIŞIYOR] — only while SPEEDHACKDETECTIONENABLED=1 / yalnızca açıkken.
SPEEDHACKBURSTWINDOW=3

// SPEEDHACKHISTORYSIZE - Length of the stored movement history (steps).
//                        Saklanan hareket geçmişinin uzunluğu (adım).
// Type / Tür: integer
// Default / Varsayılan: 20
// [WORKING] / [ÇALIŞIYOR] — MovementHistory.
SPEEDHACKHISTORYSIZE=20

// SPEEDHACKCOOLDOWNMS - Time after a violation before another one is reported (ms).
//                       Bir ihlalden sonra yenisi bildirilmeden geçen süre (ms).
// Type / Tür: integer (ms)
// Default / Varsayılan: 60000
// [WORKING] / [ÇALIŞIYOR] — only while SPEEDHACKDETECTIONENABLED=1 / yalnızca açıkken.
SPEEDHACKCOOLDOWNMS=60000

// MOUNTHEIGHT - A mounted (or hovering gargoyle) character counts 4 units taller and
//               cannot step where the ceiling is within that height. GM and AllMove
//               are exempt.
//               Binekli (veya süzülen gargoyle) karakter 4 birim daha uzun sayılır ve
//               tavanı bu yüksekliğe değen yere adım atamaz. GM ve AllMove muaftır.
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — WalkCheck.MountHeight.
MOUNTHEIGHT=0

// ============================================================================
// LIGHT, WEATHER & SEASONS / IŞIK, HAVA & MEVSİMLER
// ============================================================================

// NOWEATHER - Is there no weather (rain, snow) at all? The flag stops new weather
//             being ROLLED and TOLD to the client; weather a script set on a region
//             is kept and readable (Source-X CSector.cpp:861, CClientMsg.cpp:526).
//             Hava olayları (yağmur, kar) hiç olmasın mı? Bayrak yeni hava
//             ATILMASINI ve istemciye SÖYLENMESİNİ durdurur; scriptin bir bölgeye
//             kurduğu hava saklanır ve okunabilir (Source-X CSector.cpp:861,
//             CClientMsg.cpp:526).
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 1 — bare Source-X has NO weather; a shard that wants it
//                       writes 0 (this pack does) / çıplak Source-X'te hava YOKTUR;
//                       hava isteyen shard 0 yazar (bu paket öyle yapar)
// [WORKING] / [ÇALIŞIYOR] — WeatherEngine.NoWeather.
NOWEATHER=0

// LIGHTDAY - Daytime light level (0 = brightest, 30 = darkest).
//            Gündüz aydınlık seviyesi (0 = en parlak, 30 = en karanlık).
// Type / Tür: integer (0-30)
// Default / Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — GameWorld light calculation (GetLightSettings).
LIGHTDAY=0

// LIGHTNIGHT - Night-time light level (0 = brightest, 30 = darkest).
//              Gece aydınlık seviyesi (0 = en parlak, 30 = en karanlık).
// Type / Tür: integer (0-30)
// Default / Varsayılan: 25
// [WORKING] / [ÇALIŞIYOR] — GameWorld light calculation (GetLightSettings).
LIGHTNIGHT=25

// DUNGEONLIGHT - Light level in dungeon regions.
//                Zindan bölgelerindeki aydınlık seviyesi.
// Type / Tür: integer (0-30)
// Default / Varsayılan: 27
// [WORKING] / [ÇALIŞIYOR] — GameWorld light calculation (dungeon regions).
DUNGEONLIGHT=27

// ALLOWLIGHTOVERRIDE - A sector LIGHT pinned by staff or a script overrides the
//                      day/night calculation. 0 = sectors always follow the clock.
//                      Görevli ya da scriptin bir sektöre sabitlediği LIGHT değeri
//                      gündüz/gece hesabını ezer. 0 = sektör her zaman saate uyar.
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 1
// [WORKING] / [ÇALIŞIYOR] — GameWorld.AllowLightOverride.
ALLOWLIGHTOVERRIDE=1

// SEASONMODE - Season flow mode.
//              Mevsim akış modu.
// Type / Tür: string or integer / string veya integer
//   Auto / 0   = seasons advance automatically as the interval passes
//                mevsimler aralık doldukça otomatik ilerler
//   Manual / 1 = the season stays fixed; scripts/admins change it
//                mevsim sabit kalır; script/yönetici değiştirir
// Default / Varsayılan: Auto
// [WORKING] / [ÇALIŞIYOR] — WeatherEngine season authority / mevsim otoritesi.
SEASONMODE=Auto

// SEASONDEFAULT - Season the server starts in.
//                 Sunucu açıldığında başlayan mevsim.
// Type / Tür: integer (0-4): 0=Spring/İlkbahar, 1=Summer/Yaz, 2=Fall/Sonbahar,
//             3=Winter/Kış, 4=Desolation
// Default / Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — Login/resync/tick start from this season state.
//                           Login/resync/tick bu mevsim durumundan başlar.
SEASONDEFAULT=0

// SEASONCHANGEINTERVALMINUTES - Season change interval in Auto mode (minutes).
//                               Auto modda mevsim geçiş aralığı (dakika).
// Type / Tür: integer (0 = auto cycle off / otomatik döngü kapalı, 1+ = minutes / dakika)
// Default / Varsayılan: 30
// Note / Not: Ignored in Manual mode. / Manual modda yok sayılır.
// [WORKING] / [ÇALIŞIYOR] — WeatherEngine.
SEASONCHANGEINTERVALMINUTES=30

// ============================================================================
// STATE RECORDING & MACROS / DURUM KAYDI & MAKROLAR
// ============================================================================

// STATERECORDINGENABLED - Character state recording system (SQLite).
//                         Karakter durum kayıt sistemi (SQLite).
// Type / Tür: boolean (0/1)
//   0 = off — no SQLite DB is created, zero performance cost
//       kapalı — SQLite DB oluşturulmaz, performans etkisi sıfır
//   1 = on — position/equipment snapshots of characters are recorded; admins can
//       watch them with .SREC and shareable recordings can be made
//       açık — karakterlerin pozisyon/ekipman snapshot'ları kaydedilir; yönetici
//       .SREC ile izleyebilir, paylaşılabilir kayıtlar oluşturulabilir
// Default / Varsayılan: 0 when the key is absent; this pack turns it on
//                       anahtar hiç yazılmazsa 0; bu paket açar
// [WORKING] / [ÇALIŞIYOR] — Program StateRecorder init and tick.
STATERECORDINGENABLED=1

// STATERECORDPLAYERSONLY - Record player characters only (skip NPCs).
//                          Yalnızca oyuncu karakterlerini kaydet (NPC'leri atla).
// Type / Tür: boolean (0/1)
//   0 = every character is recorded (costly with many NPCs!)
//       tüm karakterler kaydedilir (çok NPC'de performans etkisi!)
//   1 = player characters only (recommended) / yalnızca oyuncular (önerilen)
// Default / Varsayılan: 1
// Note / Not: With 100K+ NPCs, 0 causes a serious CPU load.
//             100K+ NPC'li dünyalarda 0 ciddi CPU yükü oluşturur.
// [WORKING] / [ÇALIŞIYOR] — StateRecorder.
STATERECORDPLAYERSONLY=1

// STATERECORDMOVESCANMS - Movement scan interval (ms). Lower = finer movement
//                         record, more CPU/disk.
//                         Hareket tarama aralığı (ms). Düşük değer = daha hassas
//                         hareket kaydı, daha çok CPU/disk.
// Type / Tür: integer (ms, at least 500 / en az 500)
// Default / Varsayılan: 2000
// [WORKING] / [ÇALIŞIYOR] — StateRecorder.
STATERECORDMOVESCANMS=2000

// STATERECORDSNAPSHOTMS - Full state snapshot interval (equipment, HP, position) (ms).
//                         Tam durum snapshot aralığı (ekipman, HP, pozisyon) (ms).
// Type / Tür: integer (ms, at least 5000 / en az 5000)
// Default / Varsayılan: 15000
// [WORKING] / [ÇALIŞIYOR] — StateRecorder.
STATERECORDSNAPSHOTMS=15000

// MACROENABLED - Player macro record/playback system. Every action runs through the
//                normal game engine — skill checks, timers, weight limits,
//                success/failure all follow the standard rules.
//                Oyuncu makro kayıt/oynatma sistemi. Tüm aksiyonlar normal oyun
//                motoru üzerinden çalışır — skill check, timer, ağırlık limiti,
//                başarı/başarısızlık hepsi standart kurallarla işler.
// Type / Tür: boolean (0/1)
//   0 = off — the .MACRO command does not work / kapalı — .MACRO komutu çalışmaz
//   1 = on — players can record and repeat their actions (mining, crafting ...)
//       açık — oyuncular aksiyonlarını kaydedip tekrarlayabilir (mining, crafting ...)
// Default / Varsayılan: 1
// [WORKING] / [ÇALIŞIYOR] — MacroEngine.
MACROENABLED=1

// MACROMAXSTEPS - Most steps one macro can record.
//                 Bir makroda kaydedilebilecek en fazla adım.
// Type / Tür: integer (clamped to 5-200 / 5-200 arasına kırpılır)
// Default / Varsayılan: 50
// [WORKING] / [ÇALIŞIYOR] — MacroEngine.
MACROMAXSTEPS=50

// MACROMAXLOOPMINUTES - Longest run time of a looping macro (minutes).
//                       Döngüdeki bir makronun en uzun çalışma süresi (dakika).
// Type / Tür: integer (clamped to 1-1440 / 1-1440 arasına kırpılır)
// Default / Varsayılan: 120 (= 2 hours / 2 saat)
// [WORKING] / [ÇALIŞIYOR] — MacroEngine.
MACROMAXLOOPMINUTES=120

// ============================================================================
// ITEM DURABILITY / EŞYA DAYANIKLILIĞI
// ============================================================================

// ITEMDURABILITYENABLED - Weapons and armour take damage in combat.
//                         Savaşta silah ve zırh hasar alır.
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 1
// [WORKING] / [ÇALIŞIYOR] — CombatEngine: applied after ResolveAttack to the weapon and
//                           a random armour piece / silaha ve rastgele bir zırha uygulanır.
ItemDurabilityEnabled=1

// ITEMDURABILITYLOSSCHANCE - Chance of taking damage on each hit (%).
//                            Her vuruşta hasar alma şansı (%).
// Type / Tür: integer (0-100)
// Default / Varsayılan: 25
// [WORKING] / [ÇALIŞIYOR] — CombatEngine.DurabilityLossChance.
ItemDurabilityLossChance=25

// ITEMDURABILITYLOSSMIN / ITEMDURABILITYLOSSMAX - Range of the durability lost.
//                                                 Kaybedilen dayanıklılık aralığı.
// Type / Tür: integer (MIN 0 or more; MAX at least MIN / MIN 0 veya üstü; MAX en az MIN)
// Default / Varsayılan: 1 / 1
// [WORKING] / [ÇALIŞIYOR] — CombatEngine.DurabilityLossMin / DurabilityLossMax.
ItemDurabilityLossMin=1
ItemDurabilityLossMax=1

// ITEMBREAKONZEROHITS - 0 = the item does not break, it just stays at 0;
//                       1 = it breaks and is deleted.
//                       0 = kırılmaz, yalnızca 0'da kalır; 1 = kırılır ve silinir.
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 1
// [WORKING] / [ÇALIŞIYOR] — CombatEngine.BreakOnZeroHits.
ItemBreakOnZeroHits=1

// ITEMDEFAULTHITS - Default durability for weapons/armour without a HITS value.
//                   HITS değeri olmayan silah/zırh için varsayılan dayanıklılık.
// Type / Tür: integer (at least 1 / en az 1)
// Default / Varsayılan: 50
// [READ ONLY] / [OKUNUYOR] — Assigned to CombatEngine.DefaultHits, but nothing reads it.
//                            CombatEngine.DefaultHits'e atanıyor ama hiçbir yol okumuyor.
ItemDefaultHits=50

// ============================================================================
// DATABASE (MySQL / SQLite) / VERİTABANI (MySQL / SQLite)
// ============================================================================
// Connections used by scripts through the DB.* object. There are two ways:
// Scriptlerin DB.* nesnesiyle kullandığı bağlantılar. İki yol var:
//
// 1) Classic single connection, inside [SPHERE] (Source-X compatible). When MYSQL is
//    non-zero and MYSQLHOST is set, a connection named "default" is created and
//    connects at startup.
//    Klasik tek bağlantı, [SPHERE] içinde (Source-X uyumlu). MYSQL 0 dışı ve
//    MYSQLHOST dolu ise "default" adlı bir bağlantı kurulur ve açılışta bağlanır.
//
// MYSQL - Enable the classic MySQL connection. SERV.MYSQL returns whether it is
//         connected.
//         Klasik MySQL bağlantısını aç. SERV.MYSQL bağlı olup olmadığını döndürür.
// Type / Tür: integer (non-zero = on / 0 dışı = açık)
// Default / Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — SphereConfig.DbConnections -> ScriptDbAdapter.
// MYSQL=0
//
// MYSQLHOST / MYSQLUSER / MYSQLPASSWORD / MYSQLDATABASE - Server, user, password and
//     database name of the classic connection.
//     Klasik bağlantının sunucusu, kullanıcısı, şifresi ve veritabanı adı.
// Type / Tür: string
// Default / Varsayılan: "" (the port is always 3306; for another port use way 2)
//                       "" (port her zaman 3306; farklı port için 2. yolu kullanın)
// [WORKING] / [ÇALIŞIYOR] — only while MYSQL is non-zero / yalnızca MYSQL 0 dışıyken.
// MYSQLHOST=localhost
// MYSQLUSER=
// MYSQLPASSWORD=
// MYSQLDATABASE=
//
// 2) Named connections, OUTSIDE the [SPHERE] block, in their own sections:
//    [MYSQL <name>] or [SQLITE <name>]. A section named "default" overrides the
//    connection of way 1. Sections must come BEFORE [EOF]. To use the example
//    below, remove the leading "// " and move it above [EOF].
//    Adlandırılmış bağlantılar, [SPHERE] bloğunun DIŞINDA, kendi bölümlerinde:
//    [MYSQL <ad>] veya [SQLITE <ad>]. "default" adlı bölüm 1. yoldaki bağlantının
//    üstüne yazar. Bölümler [EOF]'tan ÖNCE olmalıdır. Aşağıdaki örneği kullanmak
//    için satır başındaki "// " işaretlerini kaldırıp [EOF]'un üstüne taşıyın.
//    Keys (all optional) / Anahtarlar (hepsi isteğe bağlı):
//      PROVIDER       - ADO.NET provider. Default: MySqlConnector
//                       ([SQLITE] sections: Microsoft.Data.Sqlite)
//                       ADO.NET sağlayıcısı. Varsayılan: MySqlConnector
//                       ([SQLITE] bölümünde Microsoft.Data.Sqlite)
//      HOST           - Server address. Default: localhost (not used by SQLite)
//                       Sunucu adresi. Varsayılan: localhost (SQLite kullanmaz)
//      PORT           - Port. Default: 3306 (not used by SQLite)
//                       Port. Varsayılan: 3306 (SQLite kullanmaz)
//      USER           - User. Default: "" / Kullanıcı. Varsayılan: ""
//      PASSWORD       - Password (SQLite: file password). Default: ""
//                       Şifre (SQLite'ta dosya şifresi). Varsayılan: ""
//      DATABASE       - Database name; for SQLite the file path. Default: ""
//                       Veritabanı adı; SQLite'ta dosya yolu. Varsayılan: ""
//      KEEPALIVE      - Keep the connection alive (60 s keepalive). Default: 0
//                       Bağlantıyı canlı tut (60 sn keepalive). Varsayılan: 0
//      CONNECTTIMEOUT - Connect timeout (seconds). Default: 30
//                       Bağlanma zaman aşımı (saniye). Varsayılan: 30
//      READTIMEOUT    - Command timeout (seconds). Default: 30
//                       Komut zaman aşımı (saniye). Varsayılan: 30
//      WRITETIMEOUT   - Write timeout (seconds). Default: 30. [READ ONLY] / [OKUNUYOR]
//                       — not added to the connection string / bağlantı dizesine eklenmez.
//                       Yazma zaman aşımı (saniye). Varsayılan: 30
//      USETHREAD      - Run queries on a dedicated thread. Default: 0
//                       Sorguları ayrı bir thread'de çalıştır. Varsayılan: 0
//      AUTOCONNECT    - Connect at startup. Default: 0
//                       Açılışta bağlan. Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — SphereConfig.LoadDbConnections -> ScriptDbAdapter.
//
// [MYSQL default]
// PROVIDER=MySqlConnector
// HOST=localhost
// PORT=3306
// USER=sphere
// PASSWORD=
// DATABASE=sphere
// KEEPALIVE=0
// CONNECTTIMEOUT=30
// READTIMEOUT=30
// WRITETIMEOUT=30
// USETHREAD=0
// AUTOCONNECT=1
//
// [SQLITE local]
// DATABASE=save/scriptdb.sqlite
// AUTOCONNECT=1

[EOF]
