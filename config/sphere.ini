//                 overloaded player could never put anything down.
//                 Oyuncunun bir eşyayı eline alabileceği üst yük yüzdesi. Ölçüm
//                 kaldırma SONRASI oluşacak yük üzerinde yapılır (CCharAct.cpp:2932),
//                 yani çizgiyi aşacak eşya reddedilir. Kaçış kapısı kural kadar
