// ACCAPP - Create unknown accounts automatically at login.
//          Bilinmeyen hesaplar login sırasında otomatik oluşturulsun.
// Type / Tür: integer (Source-X ACCAPP_* values; SphereNet treats every non-zero
//             value as "on") / (Source-X ACCAPP_* değerleri; SphereNet 0 dışındaki
//             her değeri "açık" sayar)
//   0      = only existing accounts can log in (recommended for production)
//            yalnızca önceden oluşturulmuş hesaplar girebilir (canlı için önerilir)
//   non-0  = an account is created on the first login attempt
//            0 dışı = ilk giriş denemesinde hesap otomatik oluşturulur
// Default / Varsayılan: 2 when the key is absent (on; a startup warning is printed)
//                       anahtar hiç yazılmazsa 2 (açık; açılışta uyarı basılır)
// [WORKING] / [ÇALIŞIYOR] — AccountManager.AutoCreateAccounts.
ACCAPP=0

// MAXCHARSPERACCOUNT - Maximum character slots per account.
//                      Hesap başına en fazla karakter yuvası.
// Type / Tür: integer (clamped to 1-7 / 1-7 arasına kırpılır)
// Default / Varsayılan: 5 (same as Source-X / Source-X ile aynı)
// Note / Not: UO clients support at most 7 character slots.
//             UO istemcileri en fazla 7 karakter yuvasını destekler.
// [WORKING] / [ÇALIŞIYOR] — AccountManager / GameClient character list.
MAXCHARSPERACCOUNT=7

// MINCHARDELETETIME - Minimum age a character must reach before it can be deleted
//                     (SECONDS, the same unit as Source-X). Prevents accidental
//                     deletion. Counselor and higher accounts do not wait.
//                     Karakterin silinebilmesi için geçmesi gereken en kısa yaş
//                     (SANİYE, Source-X ile aynı birim). Kazara silmeyi önler.
//                     Counselor ve üstü hesaplar beklemez.
// Type / Tür: integer (seconds; may be written as a product: 7*24*60*60)
//             integer (saniye; çarpım olarak yazılabilir: 7*24*60*60)
// Default / Varsayılan: 7*24*60*60 (= 7 days / 7 gün); 0 = delete at once / hemen sil
// [WORKING] / [ÇALIŞIYOR] — The char-select delete request checks this age.
//                           Karakter seçim ekranındaki silme isteği bu yaşı denetler.
MINCHARDELETETIME=7*24*60*60

// MD5PASSWORDS - Store account passwords as an MD5 hash.
//                Hesap şifrelerini MD5 hash olarak sakla.
// Type / Tür: boolean (0/1)
//   0 = plain-text passwords (insecure but compatible with every tool)
//       düz metin şifreler (güvensiz ama tüm araçlarla uyumlu)
//   1 = MD5-hashed passwords (safer, one-way) / MD5 hash (daha güvenli, tek yönlü)
// Default / Varsayılan: 1 when the key is absent (Source-X default 0); with 0 a
//                       startup warning is printed
//                       anahtar hiç yazılmazsa 1 (Source-X varsayılanı 0); 0 iken
//                       açılışta uyarı basılır
// [WORKING] / [ÇALIŞIYOR] — AccountManager.Md5Passwords.
MD5PASSWORDS=0

// AUTORESDISP - Set the account's resolution/display type from the client version.
//               Hesabın çözünürlük/görüntü türünü istemci sürümüne göre ayarla.
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 1
// [WORKING] / [ÇALIŞIYOR] — Client version/era is turned into ResDisp and stored on
//                           the account / istemci sürümü ResDisp'e çevrilip hesapta saklanır.
AUTORESDISP=1

// AUTOPRIVFLAGS - PRIV flags a newly created account starts with (Source-X PRIV_*).
//                 Yeni oluşturulan hesabın başladığı PRIV bayrakları (Source-X PRIV_*).
// Type / Tür: flags (Sphere rule / Sphere kuralı)
// Default / Varsayılan: 0 (reference ini example / referans ini örneği: 040)
// [WORKING] / [ÇALIŞIYOR] — AccountManager.DefaultPrivFlags.
AUTOPRIVFLAGS=0

// GUESTSMAX - Number of GUESTn guest accounts a "GUEST" login may use.
//             "GUEST" adıyla girişin kullanabileceği GUESTn misafir hesabı sayısı.
// Type / Tür: integer (0 or more / 0 veya üstü)
// Default / Varsayılan: 0 (guest login off / misafir girişi kapalı)
// [WORKING] / [ÇALIŞIYOR] — GameClient login.
GUESTSMAX=0

// CLIENTLOGINMAXTRIES - Failed login attempts on one account from one address
//                       within 15 s before the address is banned for a while.
//                       Bir hesaba aynı adresten 15 sn içinde yapılabilecek hatalı
//                       giriş denemesi; aşılırsa adres geçici olarak yasaklanır.
// Type / Tür: integer (0 or more / 0 veya üstü)
// Default / Varsayılan: 0 (off / kapalı)
// [WORKING] / [ÇALIŞIYOR] — GameClient.ConfigureLoginTries.
CLIENTLOGINMAXTRIES=0

// CLIENTLOGINTEMPBAN - Length of that temporary ban (MINUTES).
//                      Bu geçici yasağın süresi (DAKİKA).
// Type / Tür: integer (minutes / dakika)
// Default / Varsayılan: 3
// [WORKING] / [ÇALIŞIYOR] — GameClient.ConfigureLoginTries.
CLIENTLOGINTEMPBAN=3

// ============================================================================
// NETWORK / AĞ PERFORMANS AYARLARI
// ============================================================================

// USEASYNCNETWORK - Use asynchronous socket I/O.
//                   Asenkron soket G/Ç kullan.
// Type / Tür: integer (0-2)
//   0 = synchronous I/O / senkron G/Ç
//   1 = async with one thread per client / istemci başına 1 thread ile async
//   2 = async with a thread pool / thread pool ile async
// Default / Varsayılan: 0
// [NOT IMPLEMENTED] / [UYGULANMADI] — Not read by SphereConfig. The network runs on
//     the main loop with non-blocking sockets (Poll -> Receive -> Process -> Send);
//     there is no async networking. The resync mechanism (packet 0x22, .RESYNC)
//     exists.
//     SphereConfig okumaz. Ağ ana döngüde bloklamayan soketlerle işlenir (Poll ->
//     Receive -> Process -> Send); async ağ yoktur. Resync mekanizması (paket 0x22,
//     .RESYNC) mevcuttur.
USEASYNCNETWORK=0

// NETWORKTHREADS - Number of dedicated network I/O threads.
//                  Adanmış ağ G/Ç thread sayısı.
// Type / Tür: integer (0 = the main thread handles the network / ana thread yönetir)
// Default / Varsayılan: 0
// [READ ONLY] / [OKUNUYOR] — Only read back through SERV.NETWORKTHREADS; a deliberate
//                            no-op (the network runs on the main loop).
//                            Yalnızca SERV.NETWORKTHREADS ile okunur; bilinçli
//                            no-op (ağ ana döngüde işlenir).
NETWORKTHREADS=0

// NETWORKTHREADPRIORITY - Priority of network threads (0=Normal .. 4=RealTime).
//                         Ağ thread'lerinin önceliği (0=Normal .. 4=GerçekZaman).
// Type / Tür: integer (0-4)
// Default / Varsayılan: 0
// [NOT IMPLEMENTED] / [UYGULANMADI] — Not defined in SphereConfig.
//                                     SphereConfig'de tanımlı değil.
NETWORKTHREADPRIORITY=0

// MAXPACKETSPERTICK - Maximum inbound packets processed per client per tick.
//                     Tick başına istemci başına işlenen en fazla gelen paket.
// Type / Tür: integer (0 = unlimited / sınırsız)
// Default / Varsayılan: 100
// Note / Not: A connection exceeding the quota FLOODDETECTIONCOUNT times within
//             FLOODDETECTIONWINDOWMS is dropped. 0 turns off the quota AND the
//             flood detection tied to it: on an open port that lets one client run
//             unlimited packets per pass. Do not write zero.
//             Kotayı FLOODDETECTIONWINDOWMS içinde FLOODDETECTIONCOUNT kez aşan
//             bağlantı düşürülür. 0 kotayı VE ona bağlı flood tespitini kapatır:
//             açık bir portta bu, bir istemcinin tek geçişte sınırsız paket
//             işletmesi demektir. Sıfır yazmayın.
// [WORKING] / [ÇALIŞIYOR] — NetworkManager.MaxPacketsPerTick.
MAXPACKETSPERTICK=100

// FLOODDETECTIONCOUNT - How many times a connection may exceed MAXPACKETSPERTICK
//                       within FLOODDETECTIONWINDOWMS before it is dropped.
//                       Bir bağlantının FLOODDETECTIONWINDOWMS içinde
//                       MAXPACKETSPERTICK'i kaç kez aşabileceği; aşarsa düşürülür.
// Type / Tür: integer
// Default / Varsayılan: 5 (0 = flood detection off, startup warning)
//                          (0 = flood tespiti kapalı, açılışta uyarı)
// [WORKING] / [ÇALIŞIYOR] — NetworkManager.FloodDetectionCount.
FLOODDETECTIONCOUNT=5

// FLOODDETECTIONWINDOWMS - Window of the flood counter (ms).
//                          Flood sayacının pencere süresi (ms).
// Type / Tür: integer (ms)
// Default / Varsayılan: 10000 (below 1000 gives false positives, startup warning)
//                             (1000'in altı yanlış alarm üretir, açılışta uyarı)
// [WORKING] / [ÇALIŞIYOR] — NetworkManager.FloodDetectionWindowMs.
FLOODDETECTIONWINDOWMS=10000

// MAXSIZECLIENTIN - Maximum inbound bytes per client per tick.
//                   Tick başına istemci başına en fazla gelen veri (byte).
// Type / Tür: integer (bytes, 0 = unlimited / byte, 0 = sınırsız)
// Default / Varsayılan: 0
// [NOT IMPLEMENTED] / [UYGULANMADI] — Not defined in SphereConfig; NetState uses a
//                                     fixed 65536-byte buffer.
//                                     SphereConfig'de tanımlı değil; NetState sabit
//                                     65536 byte tampon kullanır.
MAXSIZECLIENTIN=0

// MAXSIZECLIENTOUT - Maximum outbound bytes per client per tick.
//                    Tick başına istemci başına en fazla giden veri (byte).
// Type / Tür: integer (bytes, 0 = unlimited / byte, 0 = sınırsız)
// Default / Varsayılan: 0
// [NOT IMPLEMENTED] / [UYGULANMADI] — Not defined in SphereConfig.
//                                     SphereConfig'de tanımlı değil.
MAXSIZECLIENTOUT=0

// MAXSIZEPERTICK - Total network I/O limit per tick (bytes).
//                  Tick başına toplam ağ G/Ç sınırı (byte).
// Type / Tür: integer (bytes, 0 = unlimited / byte, 0 = sınırsız)
// Default / Varsayılan: 0
// [NOT IMPLEMENTED] / [UYGULANMADI] — Not defined in SphereConfig.
//                                     SphereConfig'de tanımlı değil.
MAXSIZEPERTICK=0

// MAXQUEUESIZE - Maximum queued packets per client (the connection is dropped past it).
//                İstemci başına en fazla kuyruktaki paket (aşılırsa bağlantı kesilir).
// Type / Tür: integer
// Default / Varsayılan: 75
// [NOT IMPLEMENTED] / [UYGULANMADI] — Not defined in SphereConfig.
//                                     SphereConfig'de tanımlı değil.
MAXQUEUESIZE=75

// NETTTL - Lifetime of idle connections (seconds); a connection idle this long is
//          closed. It is also the lifetime of an IP's connection history.
//          Boşta bağlantıların yaşam süresi (saniye); bu süre hareketsiz kalan
//          bağlantı kapatılır. Bir IP'nin bağlantı geçmişinin ömrü de budur.
// Type / Tür: integer (seconds / saniye; below 10 = startup warning / 10'un altı uyarı)
// Default / Varsayılan: 300
// [WORKING] / [ÇALIŞIYOR] — Program.Tick idle timeout, NetworkManager.NetHistoryTtlSeconds.
NETTTL=300

// MAXCONNECTREQUESTSPERIP - Connection attempts an IP may make while its connection
//                           history lives. Does not decay; it resets when the
//                           history expires (NETTTL after the last connection closed).
//                           Bir IP'nin, bağlantı geçmişi yaşadığı sürece
//                           yapabileceği bağlantı denemesi. Azalmaz; geçmiş silinince
//                           (son bağlantı kapandıktan NETTTL sonra) sıfırlanır.
// Type / Tür: integer (0 = off / kapalı)
// Default / Varsayılan: 5 (the Source-X reference ini ships 50 / referans ini 50)
// [WORKING] / [ÇALIŞIYOR] — NetworkManager.MaxConnectRequestsPerIP.
MAXCONNECTREQUESTSPERIP=5

// MAXPINGS - Limit of connection attempts counted like pings; decays by one every
//            max(30, NETTTL/5) seconds.
//            Ping gibi sayılan bağlantı denemesi sınırı; max(30, NETTTL/5) saniyede
//            bir azalır.
// Type / Tür: integer
// Default / Varsayılan: 15
// [WORKING] / [ÇALIŞIYOR] — NetworkManager.MaxPings.
MAXPINGS=15

// TIMEOUTINCOMPLETECONN - How long a connection that has not identified itself (no
//                         login packet yet) may wait before it is closed (ms).
//                         Kendini tanıtmamış (giriş paketini göndermemiş) bir
//                         bağlantının kapatılmadan önce bekleyebileceği süre (ms).
// Type / Tür: integer (ms; may be written as a product: 5*1000 / çarpım yazılabilir)
// Default / Varsayılan: 5000 (0 = off / kapalı)
// [WORKING] / [ÇALIŞIYOR] — NetworkManager.TimeoutIncompleteConnMs.
TIMEOUTINCOMPLETECONN=5000

// DEADSOCKETTIME - Source-X: time before a dead socket is closed (MINUTES in
//                  Source-X, default 5).
//                  Source-X: ölü soketin kapatılma süresi (Source-X'te DAKİKA,
//                  varsayılan 5).
// Type / Tür: integer
// Default / Varsayılan: 300
// [READ ONLY] / [OKUNUYOR] — Only read back through SERV.DEADSOCKETTIME; idle
//                            connections are closed by NETTTL.
//                            Yalnızca SERV.DEADSOCKETTIME ile okunur; boşta
//                            bağlantılar NETTTL ile kapanır.
DEADSOCKETTIME=300

// RTTPINGINTERVALMS - Interval at which the server sends unsolicited 0x73 pings to
//                     the client (ms).
//                     Sunucunun istemciye kendiliğinden 0x73 ping gönderme aralığı (ms).
// Type / Tür: integer (ms, 0 = off / kapalı)
// Default / Varsayılan: 0
// Note / Not: CAUTION: ClassicUO feeds every incoming 0x73 into its own ping meter,
//             so server pings make the client show a meaningless (huge) ping. The
//             server-side RTT is not used by anything; keep it off unless a client
//             that ignores unsolicited pings is in use.
//             DİKKAT: ClassicUO gelen her 0x73'ü kendi ping ölçerine katar; sunucu
//             pingleri istemcide anlamsız (çok büyük) bir ping gösterir. Sunucu
//             tarafı RTT ölçümünü hiçbir şey kullanmaz; istenmeyen pingleri yok
//             sayan bir istemci yoksa kapalı tutun.
// [WORKING] / [ÇALIŞIYOR] — NetState.RttPingIntervalMs.
RTTPINGINTERVALMS=0

// CUOSTATUS / UOGSTATUS - Answer ConnectUO / UOGateway status queries.
//                         ConnectUO / UOGateway durum sorgularına cevap ver.
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 1
// [WORKING] / [ÇALIŞIYOR] — NetworkManager.CUOStatus / UOGStatus.
CUOSTATUS=1
UOGSTATUS=1

// USEHTTP - Serve the web status page (on SERVPORT+2).
//           Web durum sayfasını sun (SERVPORT+2 üzerinde).
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 1
// Note / Not: Source-X accepts 0/1/2; here "2" also counts as OFF — write 1.
//             Source-X 0/1/2 kabul eder; burada "2" de KAPALI sayılır — 1 yazın.
// [WORKING] / [ÇALIŞIYOR] — Program.AdminPanel web status server.
USEHTTP=1

// USEEXTRABUFFER - Allocate an extra output buffer per connection.
//                  Bağlantı başına ek çıktı tamponu ayır.
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 0
// [NOT IMPLEMENTED] / [UYGULANMADI] — Not defined in SphereConfig.
//                                     SphereConfig'de tanımlı değil.
USEEXTRABUFFER=0

// USEPACKETPRIORITY - Priority queue for outgoing packets.
//                     Giden paketler için öncelik kuyruğu.
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 0
// [NOT IMPLEMENTED] / [UYGULANMADI] — Not defined in SphereConfig.
//                                     SphereConfig'de tanımlı değil.
USEPACKETPRIORITY=0

// ============================================================================
// COMMANDS, STAFF & ADMINISTRATION / KOMUTLAR, GÖREVLİLER & YÖNETİM
// ============================================================================

// COMMANDPREFIX - Prefix character of in-game GM commands (only the first
//                 character counts). E.g. with "." typing ".ADD 0x0F51" in game
//                 creates an item.
//                 Oyun içi GM komutlarının önek karakteri (yalnızca ilk karakter
//                 sayılır). Örn. "." ile oyunda ".ADD 0x0F51" yazmak eşya oluşturur.
// Type / Tür: string (single character / tek karakter)
// Default / Varsayılan: "."
// [WORKING] / [ÇALIŞIYOR] — Command processor CommandPrefix.
COMMANDPREFIX=.

// DEFAULTCOMMANDLEVEL - Default PrivLevel of new accounts.
//                       Yeni hesapların varsayılan PrivLevel'ı.
// Type / Tür: integer (0-7)
//   0 = Guest / Misafir            1 = Player / Oyuncu
//   2 = Counselor / Danışman       3 = Seer / Kâhin
//   4 = GM                         5 = Dev / Geliştirici
//   6 = Admin / Yönetici           7 = Owner / Sahip
// Default / Varsayılan: 1 (Player; above Player a startup warning is printed)
//                          (Oyuncu; Oyuncu'nun üstü açılışta uyarı basar)
// [WORKING] / [ÇALIŞIYOR] — AccountManager.DefaultPrivLevel (newly created accounts).
DEFAULTCOMMANDLEVEL=1

// COMMANDLOG - Lowest privilege level whose commands are logged.
//              Komutları loglanacak en düşük yetki seviyesi.
// Type / Tür: integer (PrivLevel; -1 = none / hiçbiri)
// Default / Varsayılan: 0 (everyone's commands / herkesin komutları)
// [WORKING] / [ÇALIŞIYOR] — In-game commands and TelnetConsole.
COMMANDLOG=0

// CANSEESAMEPLEVEL - How staff see hidden (invisible/hidden) staff.
//                    Görevlilerin gizli (invisible/hidden) görevlileri görme kuralı.
// Type / Tür: integer
//   0   = equal or higher level sees / eşit veya yüksek seviye görür
//   1   = only a strictly higher level sees / yalnızca daha yüksek seviye görür
//   2-7 = that level and above see everyone / bu seviye ve üstü herkesi görür
// Default / Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — Character.CanSeeSamePLevel.
CANSEESAMEPLEVEL=0

// EXPERIMENTAL - Source-X experimental feature flags.
//                Source-X deneysel özellik bayrakları.
// Type / Tür: hex/integer
// Default / Varsayılan: 0
// [READ ONLY] / [OKUNUYOR] — Only read back through SERV.EXPERIMENTAL; SphereNet
//                            looks at none of its bits.
//                            Yalnızca SERV.EXPERIMENTAL ile okunur; SphereNet hiçbir
//                            bitine bakmaz.
EXPERIMENTAL=0

// TELNETLOG - Log telnet console commands.
//             Telnet konsol komutlarını logla.
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 1
// [WORKING] / [ÇALIŞIYOR] — TelnetConsole.
TELNETLOG=1

// SECURE - Source-X secure mode. In SphereNet the freeze monitor only runs while
//          this is on.
//          Source-X güvenli mod. SphereNet'te donma izleyicisi yalnızca bu açıkken
//          çalışır.
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 1
// [WORKING] / [ÇALIŞIYOR] — Program.FreezeMonitor.
SECURE=1

// FREEZERESTARTTIME - If the main loop makes no progress for this long the server is
//                     considered frozen and exits with code 3 (the Host restarts it).
//                     Ana döngü bu kadar süre ilerlemezse sunucu donmuş sayılır ve
//                     çıkış kodu 3 ile kapanır (Host yeniden başlatır).
// Type / Tür: integer (seconds, 0 = monitor off / saniye, 0 = izleyici kapalı)
// Default / Varsayılan: 60
// Note / Not: The monitor does not run while SECURE=0.
//             SECURE=0 iken izleyici çalışmaz.
// [WORKING] / [ÇALIŞIYOR] — Program.FreezeMonitor.
FREEZERESTARTTIME=60

// LOGMASK - Source-X log category mask.
//           Source-X log kategori maskesi.
// Type / Tür: hex/integer (0x prefix required; the reference ini's 0fff00 can NOT be
//             read) / (0x öneki gerekir; referans ini'nin 0fff00 yazımı OKUNAMAZ)
// Default / Varsayılan: 0x3F00
// [READ ONLY] / [OKUNUYOR] — SphereNet filters its logs with LOGFILELEVEL; this mask
//     is kept only for SERV.LOGMASK and the HEARALL bit (0x2000).
//     SphereNet log filtrelemesini LOGFILELEVEL ile yapar; bu maske yalnızca
//     SERV.LOGMASK ve HEARALL biti (0x2000) için tutulur.
LOGMASK=0x3F00

// HEARALL - Turns the player-speech bit (0x2000) of LOGMASK on/off.
//           LOGMASK'taki oyuncu-konuşması bitini (0x2000) açar/kapatır.
// Type / Tür: boolean (0/1)
// Default / Varsayılan: the bit in LOGMASK (on in the default mask)
//                       LOGMASK'taki bit (varsayılan maskede açık)
// Note / Not: The in-game PRIV_HEARALL (a staff member hearing every conversation)
//             is separate and is a character flag. This ini key only affects the
//             SERV.HEARALL read/toggle.
//             Oyun içi PRIV_HEARALL (görevlinin her konuşmayı duyması) ayrıdır ve
//             bir karakter bayrağıdır. Bu ini anahtarı yalnızca SERV.HEARALL
//             okumasını/geçişini etkiler.
// [READ ONLY] / [OKUNUYOR] — No speech logging depends on this bit.
//                            Hiçbir konuşma loglaması bu bite bağlı değil.
// HEARALL=1

// SENTRYDSN - DSN of the Sentry project errors are reported to.
//             Hataların gönderileceği Sentry projesinin DSN adresi.
// Type / Tür: string
// Default / Varsayılan: "" (off / kapalı)
// Note / Not: A DSN contains "https://", and "//" starts a comment in this file, so
//             the value would be cut off here; it can only be given in a form without
//             "//".
//             Bir DSN "https://" içerir ve bu dosyada "//" yorum başlattığı için
//             değer burada kesilir; yalnızca "//" içermeyen bir biçimde verilebilir.
// [WORKING] / [ÇALIŞIYOR] — Program startup (Sentry SDK) / program başlangıcı.
// SENTRYDSN=

