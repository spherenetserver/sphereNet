// COMBATFLAGS - Bit flags controlling combat (Source-X COMBAT_*).
//               Savaş davranışını kontrol eden bit bayrakları (Source-X COMBAT_*).
// Type / Tür: hex/integer (0x prefix required; a Source-X style 040000 is read as
//             DECIMAL here) / (0x öneki gerekir; Source-X usulü 040000 burada
//             ONDALIK okunur)
//   0x00001 NODIRCHANGE         - do not turn while attacking / saldırırken yön değiştirme
//   0x00002 FACECOMBAT          - face the target while attacking / hedefe dön
//   0x00004 PREHIT              - first swing without delay (not with SWING_NORANGE)
//                                 ilk vuruş gecikmesiz (SWING_NORANGE ile olmaz)
//   0x00008 ELEMENTALENGINE     - elemental damage/resist system / element sistemi
//   0x00020 DCLICKSELF_UNMOUNTS - double-click self in combat dismounts
//                                 savaşta kendine çift tık binekten indirir
//   0x00040 ALLOWHITFROMSHIP    - can be hit from a ship / gemiden vurulabilir
//   0x00080 NOPETDESERT         - pets do not desert their owner / pet terk etmez
//   0x00100 ARCHERYCANMOVE      - archers can shoot while moving / okçu yürürken atar
//   0x00200 STAYINRANGE         - a swing requires staying in range / menzilde kal
//   0x01000 STACKARMOR          - armour on the same layer stacks / zırhlar birikir
//   0x02000 NOPOISONHIT         - poisoned weapons do not poison on hit
//                                 zehirli silah vuruşta zehirlemez
//   0x04000 SLAYER              - slayer system / slayer sistemi
//   0x08000 SWING_NORANGE       - a swing completes out of range / menzil dışında biter
//   0x10000 ANIM_HIT_SMOOTH     - hit animation spread over the swing
//                                 vuruş animasyonu salınıma yayılır
//   0x20000 FIRSTHIT_INSTANT    - first hit instant / ilk vuruş anında
//   0x40000 NPC_BONUSDAMAGE     - NPCs get damage bonuses too / NPC'ler de bonus alır
//   0x80000 PARALYZE_CANSWING   - keep attacking while paralysed / felçliyken saldırı sürer
//   0x100000 ATTACK_NOAGGREIVED - attacking a murderer is not a crime
//                                 katile saldıran suçlu olmaz
// Default / Varsayılan: 0
// Note / Not: PREHIT and SWING_NORANGE cannot coexist; SWING_NORANGE is cleared
//             with a startup warning.
//             PREHIT ve SWING_NORANGE birlikte olamaz; SWING_NORANGE açılışta
//             uyarıyla kapatılır.
// [WORKING] / [ÇALIŞIYOR] — Character.CombatFlags (CombatEngine / CombatHelper).
COMBATFLAGS=0

