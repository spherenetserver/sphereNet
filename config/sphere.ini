// ============================================================================
// SphereNet Configuration File — Source-X Compatible
// SphereNet Konfigürasyon Dosyası — Source-X Uyumlu
// Counterpart of Source-X CServerConfig / CServerConfig karşılığı
//
// SYNTAX / SÖZDİZİMİ
//   KEY=VALUE. Key names are case-insensitive.
//   ANAHTAR=DEĞER. Anahtar adlarında büyük/küçük harf farkı yoktur.
//   Comments start with //. Anything after // on a line is a comment too, so a
//   value can never contain "//" (e.g. no https:// in URL).
//   Yorumlar // ile başlar. Satır içinde // sonrası da yorumdur; bu yüzden bir
//   değere "//" yazılamaz (örn. URL'de https:// kullanılamaz).
//
// NUMBERS / SAYILAR — three rules, depending on how the key is read:
// SAYILAR — anahtarın nasıl okunduğuna göre üç kural:
//   1) Most integer keys are read as DECIMAL; hexadecimal needs the 0x prefix
//      (0x20). A Sphere-style leading zero is NOT hex here: 0200 = two hundred,
//      and a value written with | (e.g. "01|010") cannot be read and the default
//      is kept. COMBATFLAGS, MAGICFLAGS, OPTIONFLAGS, CHATFLAGS,
//      RACIALFLAGS, EMOTEFLAGS, LOGMASK and FEATURE* belong to this group.
//      Çoğu tamsayı anahtarı ONDALIK okunur; onaltılık için 0x öneki gerekir
//      (0x20). Bu anahtarlarda Sphere usulü baştaki sıfır onaltılık DEĞİLDİR:
//      0200 = iki yüz; | ile yazılmış bir değer ("01|010") okunamaz ve varsayılan
//      kalır. COMBATFLAGS, MAGICFLAGS, OPTIONFLAGS, CHATFLAGS,
//      RACIALFLAGS, EMOTEFLAGS, LOGMASK ve FEATURE* bu gruptadır.
//   2) Flag keys (REVEALFLAGS, AREAFLAGS, AUTOPRIVFLAGS, STATSFLAGS, EXPERIENCEMODE,
//      COMBATPARRYINGERA)
//      follow the Sphere rule: a LEADING ZERO MEANS HEX (010 = 16) and several
//      values are OR'ed with | (01|02|010). MINCHARDELETETIME, REGEN3 and
//      TIMEOUTINCOMPLETECONN use the same rule and may be written as a product
//      (7*24*60*60, 5*1000).
//      Bayrak anahtarları (REVEALFLAGS, AREAFLAGS, AUTOPRIVFLAGS, STATSFLAGS,
//      EXPERIENCEMODE, COMBATPARRYINGERA) Sphere kuralıyla okunur: BAŞTAKİ SIFIR ONALTILIKTIR
//      (010 = 16) ve | ile birden çok değer OR'lanır (01|02|010).
//      MINCHARDELETETIME, REGEN3 ve TIMEOUTINCOMPLETECONN de bu kuralla okunur ve çarpım
//      olarak yazılabilir (7*24*60*60, 5*1000).
//   3) NPCAI, PETSINHERITNOTORIETY, ERALIMIT*, TELEPORTEFFECT*, TELEPORTSOUND*,
//      WOPCOLOR, WOPFONT, WOPTALKMODE: a 0x prefix or a leading zero means hex,
//      anything else is decimal. COLOR* keys are ALWAYS hex, with or without 0x
//      (22 = 0x22).
//      NPCAI, PETSINHERITNOTORIETY, ERALIMIT*, TELEPORTEFFECT*, TELEPORTSOUND*,
//      WOPCOLOR, WOPFONT, WOPTALKMODE: 0x öneki veya baştaki sıfır onaltılık,
//      diğerleri ondalık. COLOR* anahtarları HER ZAMAN onaltılıktır (0x'siz de:
//      22 = 0x22).
// BOOLEAN: 1, true or yes = on; anything else (including 0 and 2) = off.
// BOOLEAN: 1, true veya yes = açık; başka her şey (0 ve 2 dahil) = kapalı.
//
// STATUS TAGS / DURUM ETİKETLERİ:
//   [WORKING] / [ÇALIŞIYOR]
//       Used by the engine. / Kod tarafından aktif olarak kullanılıyor.
//   [READ ONLY] / [OKUNUYOR]
//       Loaded into the config but does not change game behaviour (at most a
//       script can read it back with SERV.<KEY>).
//       Config'e yükleniyor ama oyun davranışını etkilemiyor (en fazla bir script
//       SERV.<ANAHTAR> ile geri okuyabilir).
//   [NOT IMPLEMENTED] / [UYGULANMADI]
//       Not even loaded; a placeholder kept for Source-X ini compatibility. The
//       server lists such keys at startup as "not read by this engine".
//       Config'e bile yüklenmiyor; Source-X ini uyumu için duran yer tutucu.
//       Sunucu açılışta bunları "bu motor okumuyor" diye listeler.
//
// "Default" is the engine's own value, used when the key is absent. The active
// value in this file may differ from it on purpose.
// "Varsayılan", anahtar hiç yazılmazsa kullanılan kodun kendi değeridir. Bu
// dosyadaki etkin değer bilerek ondan farklı olabilir.
// ============================================================================

[SPHERE]

// ============================================================================
// DEBUG & LOGGING / HATA AYIKLAMA & LOG
// ============================================================================

// DEBUGPACKETS - Dump packet traffic to the console/log and lower the console
//                level to Debug. Can also be toggled from the panel at run time.
//                Paket trafiğini konsola/log'a döker ve konsol seviyesini Debug'a
//                indirir. Çalışırken panelden de açılıp kapatılabilir.
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — Program startup logging, NetworkManager packet log.
DebugPackets=0

// SCRIPTDEBUG - Log script execution traces. Can also be toggled from the panel.
//               Script yürütme izlerini loglar. Panelden de açılıp kapatılabilir.
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — TriggerRunner.ScriptDebug.
ScriptDebug=0

// DEBUGPACKETOPCODES - Optional packet debug filter: hex opcodes, comma separated.
//                      Empty logs every packet (except the 0x73 ping).
//                      Opsiyonel paket debug filtresi: hex opcode listesi, virgülle.
//                      Boşsa tüm paketler loglanır (0x73 ping hariç).
// Type / Tür: string (e.g. 22,34,BF = resync/status/extended only)
//             string (örn. 22,34,BF = yalnızca resync/status/extended)
// Default / Varsayılan: "" (all / hepsi)
// [WORKING] / [ÇALIŞIYOR] — NetworkManager.DebugPacketOpcodeFilter.
DebugPacketOpcodes=22,34,BF

// DEBUGPACKETCATEGORIES - Which kinds of packet the debug log keeps.
//                         Paket log'unda hangi tür paketlerin tutulacağı.
// Type / Tür: any of player, npc, item, packet, comma separated; empty = all
//             player, npc, item, packet (virgülle ayrılır); boş = hepsi
// Default / Varsayılan: ""
// Note / Not: A crowded street sends far more about creatures and their gear than
//             about the watching player; on a debug run that traffic is most of the
//             log and most of its cost. "player,packet" keeps the client's own
//             conversation with the server readable and drops the rest before it is
//             formatted.
//             Kalabalık bir sokak, oyuncuyla ilgili olandan çok daha fazlasını
//             yaratıklar ve eşyaları hakkında gönderir; debug koşusunda log'un da
//             maliyetinin de büyük kısmı odur. "player,packet" istemcinin sunucuyla
//             kendi konuşmasını okunur bırakır, gerisini biçimlendirmeden atar.
// [WORKING] / [ÇALIŞIYOR] — NetworkManager.DebugPacketCategoryFilter.
DebugPacketCategories=

// LOGFILELEVEL - Filter for the rolling log file logs/spherenet-*.log. The console
//                level is independent (it follows DebugPackets); this only affects
//                what reaches the file, so routine INF messages (commands, script
//                loads, connections) stay off the disk.
//                logs/spherenet-*.log dosyasının filtresi. Konsol seviyesi bundan
//                bağımsızdır (DebugPackets'e uyar); bu yalnızca dosyaya yazılanı
//                etkiler, rutin INF mesajları (komutlar, script yüklemeleri,
//                bağlantılar) diske gitmez.
// Type / Tür: two syntaxes / iki sözdizimi:
//   1) A single level = minimum threshold; that level and above are written.
//      Tek değer = en düşük eşik; o seviye ve üstü yazılır.
//        LogFileLevel=Warning      -> WRN, ERR, FTL
//        LogFileLevel=Error        -> ERR + FTL only / yalnızca ERR + FTL
//        LogFileLevel=Information  -> same as the console / konsoldakiyle aynı
//   2) A | or comma separated whitelist = ONLY the listed levels are written.
//      | veya virgülle beyaz liste = YALNIZCA listedeki seviyeler yazılır.
//        LogFileLevel=Verbose | Warning | Error | Fatal
//        LogFileLevel=Error, Fatal
//   Level names (case-insensitive) / Seviye adları (büyük/küçük harf fark etmez):
//   Verbose, Debug, Information, Warning, Error, Fatal
// Default / Varsayılan: Warning (only WRN/ERR/FTL reach the disk / yalnızca WRN/ERR/FTL)
// [WORKING] / [ÇALIŞIYOR] — Serilog file sink filter.
LogFileLevel=Warning

// ============================================================================
// PERFORMANCE & MULTICORE / PERFORMANS & MULTICORE
// ============================================================================

// TICKSLEEPMODE - How the main loop yields the CPU between ticks.
//                 Tick'ler arasında ana döngünün CPU'yu nasıl bıraktığı.
// Type / Tür: integer (0-3)
//   0 = spin     — lowest latency (<1ms), highest CPU; for dedicated servers.
//                  en düşük gecikme (<1ms), en yüksek CPU; adanmış sunucular için.
//   1 = sleep    — minimal CPU, ~15ms latency; for low-end/shared machines.
//                  minimum CPU, ~15ms gecikme; zayıf/paylaşımlı makineler için.
//   2 = hybrid   — balanced, ~1ms latency, moderate CPU.
//                  dengeli, ~1ms gecikme, orta CPU.
//   3 = adaptive — sleeps out the slack until the next tick in capped slices:
//                  near-zero idle CPU with bounded input latency; compare the
//                  [tick_stats] lpt gauge before/after switching.
//                  bir sonraki tick'e kadar kalan süreyi sınırlı dilimlerle uyur:
//                  boştayken CPU ~0, giriş gecikmesi sınırlı; geçişten önce/sonra
//                  [tick_stats] lpt ölçüsünü karşılaştırın.
// Default / Varsayılan: 2
// [WORKING] / [ÇALIŞIYOR] — Program.Tick main loop.
TickSleepMode=2

// SLOWTICKWARNMS / LOOPSTALLWARNMS - Diagnostic thresholds (ms). A server tick
//     slower than SlowTickWarnMs logs [slow_tick]; a main-loop iteration slower
//     than LoopStallWarnMs logs [loop_stall]. 0 disables that warning.
//     Tanı eşikleri (ms). SlowTickWarnMs'ten yavaş bir sunucu tick'i [slow_tick],
//     LoopStallWarnMs'ten yavaş bir ana döngü turu [loop_stall] uyarısı loglar.
//     0 = o uyarı kapalı.
// Type / Tür: integer (ms)
// Default / Varsayılan: 50 / 100 (half / all of the 100ms tick budget)
//                                (100ms tick bütçesinin yarısı / tamamı)
// [WORKING] / [ÇALIŞIYOR] — Program.Tick.
SlowTickWarnMs=50
LoopStallWarnMs=100

// SLOWPACKETWARNMS - A single inbound packet handler slower than this logs
//                    [slow_packet] with the opcode and handler name; names the
//                    culprit when a [loop_stall] comes from net_in.
//                    Tek bir gelen paketin handler'ı bu eşikten uzun sürerse
//                    opcode ve handler adıyla [slow_packet] loglanır; net_in
//                    kaynaklı bir [loop_stall]'un hangi paketten geldiğini söyler.
// Type / Tür: integer (ms, 0 = off / kapalı)
// Default / Varsayılan: 20
// [WORKING] / [ÇALIŞIYOR] — NetworkManager.SlowPacketWarnMs.
SlowPacketWarnMs=20

// Note / Not: The multicore tick pipeline is always on — Build (parallel) ->
//             Apply (serial). On an error or timeout it falls back to a single
//             thread automatically; there is no switch for it.
//             Multicore tick hattı her zaman açıktır — Build (paralel) -> Apply
//             (seri). Hata veya zaman aşımında otomatik olarak tek thread'e
//             düşer; bunun için bir anahtar yoktur.

// MULTICOREWORKERCOUNT - Number of worker threads for the parallel phases.
//                        Paralel fazlarda kullanılacak iş parçacığı sayısı.
// Type / Tür: integer (0 = automatic, ProcessorCount / 0 = otomatik, ProcessorCount)
// Default / Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — Parallel.ForEach MaxDegreeOfParallelism.
MulticoreWorkerCount=0

// MULTICOREPHASETIMEOUTMS - Timeout of one multicore phase (ms).
//                           Bir multicore fazının zaman aşımı (ms).
// Type / Tür: integer (ms, minimum 100 / en az 100)
// Default / Varsayılan: 5000
// Note / Not: When exceeded the runtime flag is cleared and the tick falls back
//             to a single thread. Below 100 a startup warning is printed.
//             Aşıldığında çalışma bayrağı kapanır ve tick tek thread'e döner.
//             100'ün altı açılışta uyarı basar.
// [WORKING] / [ÇALIŞIYOR] — CancellationTokenSource timeout.
MulticorePhaseTimeoutMs=5000

// MULTICOREDETERMINISMDEBUG - Determinism check mode: a SHA-256 hash of the world
//                             is computed and logged at the end of each tick
//                             (first 2000 ticks).
//                             Determinizm doğrulama modu: her tick sonunda dünyanın
//                             SHA-256 hash'i hesaplanıp loglanır (ilk 2000 tick).
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — MaybeRunDeterminismGuardrail().
MulticoreDeterminismDebug=0

// MULTICOREDETERMINISMEXPECTEDHASH - Expected determinism hash; a mismatch logs a
//                                    warning. Empty = no comparison.
//                                    Beklenen determinizm hash'i; uyuşmazlıkta
//                                    uyarı loglanır. Boş = karşılaştırma yok.
// Type / Tür: string (SHA-256 hex)
// Default / Varsayılan: ""
// [WORKING] / [ÇALIŞIYOR] — Program.Tick.
MulticoreDeterminismExpectedHash=

// ============================================================================
// SERVER IDENTITY, PANEL & HOST / SUNUCU KİMLİĞİ, PANEL & HOST
// ============================================================================

// SERVNAME - Name shown in the server list and on the status page.
//            Sunucu listesinde ve durum sayfasında görünen ad.
// Type / Tür: string
// Default / Varsayılan: "SphereNet"
// [WORKING] / [ÇALIŞIYOR] — 0xA8 server list, WebStatusServer, TelnetConsole, panel.
SERVNAME=SphereNet

// SERVPORT - TCP port the game server listens on.
//            Oyun sunucusunun dinlediği TCP portu.
// Type / Tür: integer (1-65535)
// Default / Varsayılan: 2593
// Note / Not: Standard UO port is 2593. Telnet console: SERVPORT+1, web status:
//             SERVPORT+2, panel (when ADMINPANELPORT=0): SERVPORT+3.
//             Standart UO portu 2593. Telnet konsol: SERVPORT+1, web durum:
//             SERVPORT+2, panel (ADMINPANELPORT=0 iken): SERVPORT+3.
// [WORKING] / [ÇALIŞIYOR] — NetworkManager.Start().
SERVPORT=2593

// SERVIP - IP address announced to the client in the login server list (0xA8)
//          and in the relay to the game server (0x8C).
//          Giriş sunucu listesinde (0xA8) ve oyun sunucusuna yönlendirmede (0x8C)
//          istemciye bildirilen IP adresi.
// Type / Tür: string (IPv4)
// Default / Varsayılan: "0.0.0.0" (= the local address the connection came in on,
//                        else 127.0.0.1 / bağlantının geldiği yerel adres, o da
//                        yoksa 127.0.0.1)
// Note / Not: Does NOT change the listening address; the socket always listens on
//             0.0.0.0:SERVPORT. Behind NAT/a router put the public IP here.
//             Dinlenen adresi DEĞİŞTİRMEZ; soket her zaman 0.0.0.0:SERVPORT dinler.
//             NAT/yönlendirici arkasındaki bir sunucuda dış IP buraya yazılır.
// [WORKING] / [ÇALIŞIYOR] — Program.BuildServerList / ResolveAdvertisedIp; SERV.SERVIP.
// SERVIP=0.0.0.0

// SERVERLIST - Extra shards listed on the login screen IN ADDITION to this one.
//              Giriş ekranındaki sunucu listesine bu shard'a EK olarak konan sunucular.
// Type / Tür: string — ';' separated "name,ip,port" entries (no port = SERVPORT)
//             ';' ile ayrılmış "ad,ip,port" girdileri (port yoksa SERVPORT)
// Default / Varsayılan: "" (only this shard / yalnızca bu shard)
// Note / Not: Counterpart of the Source-X [SERVERS] block; a malformed entry is
//             skipped silently.
//             Source-X [SERVERS] bloğunun karşılığı; hatalı girdi sessizce atlanır.
// [WORKING] / [ÇALIŞIYOR] — 0xA8 server list (Program.BuildServerList).
// SERVERLIST=Test Shard,192.168.1.10,2593;Event Shard,192.168.1.11,2594

// URL - The shard's website; given to scripts as SERV.URL.
//       Shard'ın web sitesi; scriptlere SERV.URL olarak verilir.
// Type / Tür: string
// Default / Varsayılan: "www.spherenetserver.com"
// Note / Not: "//" starts a comment in this file, so https:// cannot be written;
//             the script side adds the scheme when needed. Source-X also only
//             returns the value through SERV.URL.
//             Bu dosyada "//" yorum başlattığı için https:// yazılamaz; şemayı
//             gerekirse script tarafı ekler. Source-X de değeri yalnızca SERV.URL
//             ile döndürür.
// [WORKING] / [ÇALIŞIYOR] — SERV.URL.
// URL=www.myshard.com

// ADMINEMAIL - Administrator e-mail address; given to scripts as SERV.ADMINEMAIL.
//              Yönetici e-posta adresi; scriptlere SERV.ADMINEMAIL olarak verilir.
// Type / Tür: string
// Default / Varsayılan: ""
// [READ ONLY] / [OKUNUYOR] — Only read back through SERV.ADMINEMAIL; the engine
//                            does not use it.
// ADMINEMAIL=

// ADMINPASSWORD - Password of the telnet admin console and the web panel.
//                 Telnet yönetim konsolu ve web paneli şifresi.
// Type / Tür: string
// Default / Varsayılan: "1234" when the key is ABSENT; an empty value disables the
//                       telnet admin console.
//                       Anahtar HİÇ yazılmazsa "1234"; boş değer telnet admin
//                       konsolunu kapatır.
// Note / Not: This file leaves it empty; the panel setup wizard hashes the chosen
//             password and writes it here.
//             Bu dosya boş bırakır; panel kurulum sihirbazı seçilen şifreyi
//             hash'leyip buraya yazar.
// [WORKING] / [ÇALIŞIYOR] — TelnetConsole, AdminHostPolicy, SphereNet.Host/Panel.
ADMINPASSWORD=

// ADMINPANELAUTOFILL - Pre-fill ADMINPASSWORD on the panel login screen.
//                      Panel giriş ekranında ADMINPASSWORD'u otomatik doldur.
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 0 (off / kapalı)
// Note / Not: Only for requests from localhost and only while ADMINPASSWORD is
//             plain text; once the setup wizard hashes it, auto-fill stops. It
//             hands the password to the browser, so enable it for local
//             development only.
//             Yalnızca localhost'tan gelen istekte ve ADMINPASSWORD düz metin iken
//             çalışır; kurulum sihirbazı şifreyi hash'e çevirince durur. Şifreyi
//             tarayıcıya verdiği için yalnızca yerel geliştirmede açın.
// [WORKING] / [ÇALIŞIYOR] — PanelHost /api/auth/local-hint.
ADMINPANELAUTOFILL=0

// ADMINPANELPORT - Port the web panel listens on.
//                  Web panelin dinlediği port.
// Type / Tür: integer
// Default / Varsayılan: 0 (= SERVPORT+3)
// [WORKING] / [ÇALIŞIYOR] — SphereNet.Host and Program.AdminPanel.
ADMINPANELPORT=9999

// ADMINPANELALLOWEDHOSTS - Host names the panel answers to (comma separated).
//                          Panelin cevap verdiği Host adları (virgülle).
// Type / Tür: string
// Default / Varsayılan: "" (only localhost, 127.0.0.1, ::1 / yalnızca bunlar)
// Note / Not: The panel listens on localhost only. Behind a reverse proxy put the
//             public name the proxy forwards here (e.g. panel.myshard.com). A
//             request with a Host not on the list gets 400: this stops a malicious
//             page from pointing its own domain at 127.0.0.1 and using the panel
//             (DNS rebinding). "*" disables the check.
//             Panel yalnızca localhost'u dinler. Reverse proxy arkasında proxy'nin
//             ilettiği genel adı buraya yazın (örn. panel.sunucum.com). Listede
//             olmayan Host adıyla gelen istek 400 alır: kötü niyetli bir sayfanın
//             kendi alan adını 127.0.0.1'e yönlendirip paneli kullanmasını (DNS
//             rebinding) engeller. "*" kontrolü kapatır.
// [WORKING] / [ÇALIŞIYOR] — PanelHost Host header filter.
ADMINPANELALLOWEDHOSTS=

// PUBLICPAPERDOLL - Serve character paperdoll image and info without login:
//                   /public/paperdoll/<serial>.png and /public/paperdoll/<serial>.json
//                   Karakter paperdoll resmini ve bilgisini girişsiz sunar:
//                   /public/paperdoll/<serial>.png ve /public/paperdoll/<serial>.json
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 0 (off; both addresses answer 404 / kapalı; iki adres de 404)
// Note / Not: The serial may be hex (0x.. or leading 0) or decimal. Only player
//             characters are shown; staff (Counselor and up), NPCs, deleted and
//             unknown serials get the same 404. The JSON has no plevel/account/IP.
//             Cache-Control max-age=60; 60 requests per minute per IP. The panel
//             listens on localhost only: outside access goes through a reverse
//             proxy whose Host name must be in ADMINPANELALLOWEDHOSTS.
//             Serial hex (0x.. ya da 0 ile başlayan) veya ondalık yazılır. Yalnızca
//             oyuncu karakterleri gösterilir; personel (Counselor ve üstü), NPC,
//             silinmiş ve bilinmeyen serial aynı 404'ü alır. JSON'da
//             plevel/hesap/IP yoktur. Cache-Control max-age=60; IP başına dakikada
//             60 istek. Panel yalnızca localhost'u dinler: dışarıdan erişim reverse
//             proxy ile olur ve proxy'nin Host adı ADMINPANELALLOWEDHOSTS'ta olmalıdır.
// [WORKING] / [ÇALIŞIYOR] — PanelHost /public/paperdoll.
PUBLICPAPERDOLL=0

// PUBLICPAPERDOLLORIGINS - Web sites (CORS) allowed to read the public paperdoll
//                          from a browser (fetch/XHR), comma separated.
//                          Herkese açık paperdoll'u tarayıcıdan (fetch/XHR)
//                          okuyabilecek web siteleri (CORS), virgülle.
// Type / Tür: string
// Default / Varsayılan: "" (no CORS header; an <img> tag still works)
//                       (CORS başlığı gönderilmez; <img> etiketi yine çalışır)
// Note / Not: Write the domain only (plus :port if needed), e.g. www.myshard.com —
//             "//" starts a comment here so https:// cannot be written; http and
//             https are both accepted. "*" allows every site.
//             Yalnızca alan adı (gerekirse :port) yazın, örn. www.sunucum.com —
//             "//" yorum başlattığı için https:// yazılamaz; http ve https ikisi de
//             kabul edilir. "*" her siteye izin verir.
// [WORKING] / [ÇALIŞIYOR] — PanelHost /public/paperdoll Access-Control-Allow-Origin.
PUBLICPAPERDOLLORIGINS=

// SCRIPTPACKREPO - GitHub script pack (owner/name) the "Install" button on the
//                  panel's Scripts page downloads.
//                  Panelin Scripts sayfasındaki "Install" düğmesinin indirdiği
//                  GitHub script paketi (sahip/ad).
// Type / Tür: string
// Default / Varsayılan: Sphereserver/Scripts-X (official Source-X pack / resmi paket)
// Note / Not: Packs with files at the repo root or under scripts/ are both
//             supported. Top-level folders starting with "_" (_incomplete etc.)
//             are not installed.
//             Dosyaları depo kökünde ya da scripts/ klasöründe olan paketlerin ikisi
//             de desteklenir. "_" ile başlayan üst klasörler (_incomplete vb.)
//             kurulmaz.
// [WORKING] / [ÇALIŞIYOR] — PanelHost /api/scripts/download.
SCRIPTPACKREPO=Sphereserver/Scripts-X

// SCRIPTPACKBRANCH - Branch to download.
//                    İndirilecek dal.
// Type / Tür: string
// Default / Varsayılan: main
// [WORKING] / [ÇALIŞIYOR] — PanelHost /api/scripts/download.
SCRIPTPACKBRANCH=main

// HOSTAUTOSTART - SphereNet.Host starts the game server by itself when it starts.
//                 SphereNet.Host açılınca oyun sunucusunu kendisi başlatsın.
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 1
// Note / Not: With 0 the server is started with "Start" in the panel. 1 is
//             recommended so the shard does not stay down after an update or a
//             restart.
//             0 ise sunucu panelden "Start" ile başlatılır. Güncelleme veya yeniden
//             başlatma sonrası shard'ın kapalı kalmaması için 1 önerilir.
// [WORKING] / [ÇALIŞIYOR] — SphereNet.Host.
HOSTAUTOSTART=1

// HOSTRESTARTONCRASH - Host restarts the server if it crashes.
//                      Sunucu çökerse Host onu yeniden başlatsın.
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 1
// Note / Not: Waits 5, 10, 20 s... up to 2 min. Stops after 5 crashes in 10
//             minutes (so a server that always crashes at startup does not loop
//             forever). A normal exit (code 0) and Stop from the panel are not
//             crashes.
//             Bekleme 5, 10, 20 sn... en fazla 2 dk. 10 dakikada 5 çökmeden sonra
//             durur (açılışta hep çöken sunucu sonsuz döngüye girmesin). Normal
//             kapanış (çıkış kodu 0) ve panelden Stop çökme sayılmaz.
// [WORKING] / [ÇALIŞIYOR] — SphereNet.Host ServerProcess.
HOSTRESTARTONCRASH=1

// HOSTSHUTDOWNQUIETMS - If a shutting-down server prints nothing for this long
//                       (ms), the Host treats it as stuck and terminates it.
//                       Kapanmakta olan sunucu bu kadar süre (ms) hiç çıktı
//                       üretmezse Host onu takılmış sayar ve sonlandırır.
// Type / Tür: integer (ms, clamped to 1000-600000 / 1000-600000 arasına kırpılır)
// Default / Varsayılan: 20000
// Note / Not: A large world's shutdown save can take long on slow storage; a kill
//             there loses everything since the last periodic save.
//             Büyük bir dünyanın kapanış kaydı yavaş diskte uzun sürebilir; erken
//             sonlandırma son periyodik kayıttan bu yana olan her şeyi kaybettirir.
// [WORKING] / [ÇALIŞIYOR] — SphereNet.Host ServerProcess.
HOSTSHUTDOWNQUIETMS=20000

// HOSTSHUTDOWNTIMEOUTMS - Absolute ceiling for a shutdown (ms); past it the
//                         process is terminated.
//                         Kapanış için mutlak üst süre (ms); aşılırsa süreç
//                         sonlandırılır.
// Type / Tür: integer (ms, clamped to 1000-3600000 / 1000-3600000 arasına kırpılır)
// Default / Varsayılan: 180000
// [WORKING] / [ÇALIŞIYOR] — SphereNet.Host ServerProcess.
HOSTSHUTDOWNTIMEOUTMS=180000

// ============================================================================
// UPDATES FROM THE PANEL / PANEL ÜZERİNDEN GÜNCELLEME (Updates page / sayfası)
// ============================================================================
// There are two separate update paths; do not mix them up:
// İki ayrı güncelleme yolu var, karıştırmayın:
//   * APPUPDATE* (below) -> the panel's "Check for update" flow. Downloads the
//     READY binary built by GitHub Actions. The machine needs NO git/SDK/Node.
//     Updates the server from the panel with one click.
//     APPUPDATE* (aşağıdakiler) -> panelin "Check for update" akışı. GitHub
//     Actions'ın ürettiği HAZIR binary'yi indirir. Makinede git/SDK/Node
//     GEREKMEZ. Sunucuyu panelden tek tıkla günceller.
//   * APPUPDATEREPODIR (at the bottom) -> update.cmd's build-from-source flow.
//     Needs git + .NET SDK + Node on the machine and runs while the server is
//     STOPPED.
//     APPUPDATEREPODIR (en altta) -> update.cmd'nin kaynaktan derleme akışı.
//     Makinede git + .NET SDK + Node ister ve sunucu KAPALIYKEN çalışır.

// APPUPDATEREPO - GitHub repository ("owner/name") updates are pulled from.
//                 Güncellemelerin çekileceği GitHub deposu ("sahip/ad").
// Type / Tür: string
// Default / Varsayılan: "" (empty = the panel update system is off and the page
//                       is hidden / boş = panel güncelleme sistemi tamamen kapalı,
//                       sayfa gizlenir)
// Note / Not: A public repo needs NO token; release assets are downloaded anonymously.
//             Depo public ise token GEREKMEZ; release asset'leri anonim indirilir.
// [WORKING] / [ÇALIŞIYOR] — read by SphereNet.Host, served by PanelHost /api/update/*.
APPUPDATEREPO=spherenetserver/sphereNet

// APPUPDATECHANNEL - Release tag the packages hang on.
//                    Paketlerin asılı olduğu release tag'i.
// Type / Tür: string
// Default / Varsayılan: nightly
// Note / Not: "nightly" is a rolling prerelease updated on every main commit
//             (see .github/workflows/release.yml). To get only hand-tagged stable
//             releases, write that tag here.
//             "nightly" her main commit'inde otomatik güncellenen rolling
//             prerelease'tir (bkz. .github/workflows/release.yml). Yalnızca elle
//             etiketlenmiş kararlı sürümleri istiyorsanız buraya o tag'i yazın.
// [WORKING] / [ÇALIŞIYOR] — SphereNet.Host updater.
APPUPDATECHANNEL=nightly

// APPUPDATERUNTIME - Platform (RID) of the package to download; decides the asset
//                    name spherenet-<RID>.zip.
//                    İndirilecek paketin platformu (RID); asset adını belirler:
//                    spherenet-<RID>.zip.
// Type / Tür: string
// Default / Varsayılan: win-x64
// Note / Not: CI currently builds the win-x64 package only.
//             CI şu an yalnızca win-x64 paketi üretiyor.
// [WORKING] / [ÇALIŞIYOR] — SphereNet.Host updater.
APPUPDATERUNTIME=win-x64

// APPUPDATECHECKMINUTES - Background check interval for a new version (minutes).
//                         Arka planda yeni sürüm kontrol aralığı (dakika).
// Type / Tür: integer (minutes / dakika)
// Default / Varsayılan: 15
// Note / Not: 0 = no automatic check (only "Check for update" in the panel). The
//             check NEVER applies an update by itself; it only shows a badge.
//             0 = otomatik kontrol kapalı (yalnızca panelden elle "Check for
//             update"). Kontrol ASLA kendiliğinden güncelleme uygulamaz; yalnızca
//             rozet gösterir.
// [WORKING] / [ÇALIŞIYOR] — SphereNet.Host updater.
APPUPDATECHECKMINUTES=15

// APPUPDATETOKEN - Optional GitHub token.
//                  İsteğe bağlı GitHub token'ı.
// Type / Tür: string
// Default / Varsayılan: "" (empty / boş)
// Note / Not: NOT needed for a public repo; leave it empty. Only needed if the
//             repository is made private (contents:read is enough).
//             Public depoda GEREKSİZ, boş bırakın. Yalnızca depo private yapılırsa
//             gerekir (contents:read yetkisi yeter).
// [WORKING] / [ÇALIŞIYOR] — SphereNet.Host updater.
APPUPDATETOKEN=

// APPUPDATEREPODIR - Source (git) folder for update.cmd (one-command update). Read
//                    ONLY by update.cmd/update.ps1; SphereNet.Host does not use it.
//                    If this working folder holds only published binaries (e.g.
//                    C:\sphereNet), point this at a git clone: update.cmd runs git
//                    pull + build.ps1 in that clone and copies the produced
//                    binaries here. That machine needs git + .NET SDK + Node/npm. A
//                    relative path is resolved against sphere.ini. May stay empty
//                    when the working folder is the repo. Example:
//                    update.cmd (tek komutla güncelleme) için kaynak (git) klasörü.
//                    YALNIZCA update.cmd/update.ps1 okur; SphereNet.Host kullanmaz.
//                    Bu çalışma klasörü yalnızca publish edilmiş binary'lerden
//                    oluşuyorsa (örn. C:\sphereNet), burayı bir git klonuna
//                    yönlendirin: update.cmd o klonda git pull + build.ps1 çalıştırır,
//                    sonra üretilen binary'leri buraya kopyalar. O makinede git +
//                    .NET SDK + Node/npm kurulu olmalıdır. Göreli yol sphere.ini'ye
//                    göre çözülür. Çalışma klasörü repo ise boş kalabilir. Örnek:
//                    APPUPDATEREPODIR=D:\Projeler\Yunus\sphereNet
// Type / Tür: string (folder path / klasör yolu)
// Default / Varsayılan: ""
// [WORKING] / [ÇALIŞIYOR] — update.cmd / update.ps1 only / yalnızca.
APPUPDATEREPODIR=

// ============================================================================
// CLIENT & CONNECTION / İSTEMCİ & BAĞLANTI AYARLARI
// ============================================================================

// CLIENTERA - Default client compatibility profile, used until the client
//             reports its version.
//             İstemci sürümünü bildirene kadar kullanılan varsayılan uyumluluk profili.
// Type / Tür: Sphere56x | Modern (or 0 | 1 / veya 0 | 1)
//   Sphere56x: an unknown client uses the old Sphere 56x packet formats.
//              bilinmeyen istemci eski Sphere 56x paket formatlarını kullanır.
//   Modern:    modern formats (ClassicUO/7.x) are assumed until the version arrives.
//              sürüm gelene kadar modern formatlar (ClassicUO/7.x) varsayılır.
// Default / Varsayılan: Modern
// [WORKING] / [ÇALIŞIYOR] — NetworkManager.DefaultClientEra.
ClientEra=Sphere56x

// CLIENTVERSION - Expected client version string.
//                 Beklenen istemci sürüm dizgisi.
// Type / Tür: string (major.minor.revision.patch)
//   "4.0.2"     - T2A era client / T2A dönemi istemcisi
//   "5.0.9.1"   - AOS era client / AOS dönemi istemcisi
//   "7.0.96.5"  - last classic client / son klasik istemci
// Default / Varsayılan: "4.0.2"
// [READ ONLY] / [OKUNUYOR] — Only logged at startup. Each connection's client
//                            version comes from what the client itself reports and
//                            is not compared with this value.
//                            Yalnızca açılışta loglanır. Her bağlantının istemci
//                            sürümü istemcinin kendi bildirdiğinden alınır; bu
//                            değerle karşılaştırılmaz.
CLIENTVERSION=7.0.96.5

// CLIENTMAX - Maximum number of clients connected at the same time.
//             Aynı anda bağlanabilecek en fazla istemci sayısı.
// Type / Tür: integer (0 or less = 256 / 0 veya altı = 256)
// Default / Varsayılan: 256
// Note / Not: Every connection takes a NetState slot; higher = more memory.
//             Her bağlantı bir NetState slotu kullanır; yüksek değer = daha çok bellek.
// [WORKING] / [ÇALIŞIYOR] — NetworkManager slot pool.
CLIENTMAX=1100

// CLIENTMAXIP - Maximum connections from a single IP address.
//               Tek bir IP adresinden en fazla bağlantı sayısı.
// Type / Tür: integer (0 = unlimited / sınırsız)
// Default / Varsayılan: 16 (same as Source-X / Source-X ile aynı)
// Note / Not: NetworkManager counts the open connections of the IP on every accept
//             and refuses at the limit. If more than 16 people play from one
//             address (an internet cafe), raise it, or the 17th is refused though
//             legitimate. A reconnecting player's old connection may be counted
//             until it is collected, so keep the limit a little above the player
//             count.
//             NetworkManager her kabulde bu IP'nin açık bağlantılarını sayar ve
//             sınırda reddeder. Aynı adresten 16'dan fazla kişi oynayacaksa
//             (internet kafe) yükseltin; yoksa 17. kişi meşru olduğu halde
//             reddedilir. Yeniden bağlanan oyuncunun eski bağlantısı toplanana kadar
//             ikisi birlikte sayılabilir; sınırı oyuncu sayısının biraz üstünde tutun.
// [WORKING] / [ÇALIŞIYOR] — NetworkManager.ClientMaxIP.
CLIENTMAXIP=16

// CLIENTLINGER - How long a player's character stays in the world after the
//                connection drops without a safe logout (seconds).
//                Güvenli çıkış yapmadan bağlantısı kopan oyuncunun karakterinin
//                dünyada kalma süresi (saniye).
// Type / Tür: integer (seconds, 0 = leave at once / saniye, 0 = hemen çıkar)
// Default / Varsayılan: 60
// Note / Not: Linkdead time — a player reconnecting within it gets the character
//             back. Dead characters and safe logouts (inn/house) do not wait.
//             Source-X reads the key in seconds too.
//             Linkdead süresi — bu sürede yeniden bağlanan oyuncu karakterine döner.
//             Ölüler ve güvenli çıkış (han/ev) beklemez. Source-X de saniye okur.
// [WORKING] / [ÇALIŞIYOR] — GameClient.ClientLingerSeconds.
CLIENTLINGER=300

// CONNECTINGMAX - Maximum clients in the pre-login (connecting) stage.
//                 Giriş yapma aşamasındaki (pre-login) en fazla istemci sayısı.
// Type / Tür: integer
// Default / Varsayılan: 32
// [READ ONLY] / [OKUNUYOR] — Only read back through SERV.CONNECTINGMAX; no separate
//                            "connecting" limit is enforced (the per-IP one is
//                            CONNECTINGMAXIP).
//                            Yalnızca SERV.CONNECTINGMAX ile okunur; ayrı bir
//                            "connecting" sınırı uygulanmaz (IP başına sınır
//                            CONNECTINGMAXIP'tedir).
CONNECTINGMAX=32

// CONNECTINGMAXIP - Maximum not-yet-in-game connections per IP.
//                   IP başına oyuna henüz girmemiş en fazla bağlantı sayısı.
// Type / Tür: integer (0 = unlimited / sınırsız)
// Default / Varsayılan: 8
// Note / Not: An IP past this is refused (Source-X CNetworkManager.cpp:159).
//             Loopback is exempt.
//             Bunu aşan IP reddedilir (Source-X CNetworkManager.cpp:159). Loopback
//             muaftır.
// [WORKING] / [ÇALIŞIYOR] — NetworkManager.ConnectingMaxIP.
CONNECTINGMAXIP=8

// USECRYPT - Accept encrypted (Blowfish/Twofish) login.
//            Şifreli (Blowfish/Twofish) girişi kabul et.
// Type / Tür: boolean (0/1)
//   0 = accept unencrypted clients only / yalnızca şifresiz istemci
//   1 = accept encrypted clients (standard UO) / şifreli istemci (standart UO)
// Default / Varsayılan: 1
// [WORKING] / [ÇALIŞIYOR] — NetworkManager crypto selection (sphereCrypt.ini keys).
USECRYPT=1

// USENOCRYPT - Accept unencrypted connections alongside encrypted ones.
//              Şifreli bağlantıların yanında şifresiz bağlantıları da kabul et.
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — Works together with USECRYPT / USECRYPT ile birlikte.
USENOCRYPT=1

// COLORNOTO* - Hue of the overhead name label per notoriety (single click).
//              Tek tıklamada çıkan isim etiketinin notoriety'ye göre rengi.
// Type / Tür: hex hue (ALWAYS hex, with or without 0x: 22 = red, 59 = blue,
//             3b2 = grey, 90 = orange) / hex hue (HER ZAMAN onaltılık: 22 =
//             kırmızı, 59 = mavi, 3b2 = gri, 90 = turuncu)
// Default / Varsayılan: the values below / aşağıdaki değerler
// Note / Not: 0 = use the built-in default. Hue 0 never means "black": writing 0
//             applies the default colour. Leave these commented unless you want
//             custom colours; the defaults are already coloured.
//             0 = motorun yerleşik varsayılanını kullan. Hue 0 asla "siyah" demek
//             değildir; 0 yazarsanız varsayılan renk uygulanır. Özel renk
//             istemiyorsanız yorumda bırakın; varsayılanlar zaten renklidir.
// [WORKING] / [ÇALIŞIYOR] — Notoriety name hues (Program.EngineWiring).
// COLORNOTOGOOD=059              // blue (innocent) / mavi (masum)
// COLORNOTOGOODNPC=059           // blue (innocent NPC) / mavi (masum NPC)
// COLORNOTOGUILDSAME=03f         // green (ally) / yeşil (müttefik)
// COLORNOTONEUTRAL=03b2          // grey (can be attacked) / gri (saldırılabilir)
// COLORNOTOCRIMINAL=03b2         // grey (criminal) / gri (suçlu)
// COLORNOTOGUILDWAR=090          // orange (enemy guild) / turuncu (düşman lonca)
// COLORNOTOEVIL=022              // red (murderer) / kırmızı (katil)
// COLORNOTOINVUL=035             // yellow (invulnerable) / sarı (ölümsüz)
// COLORNOTOINVULGAMEMASTER=0b    // purple (GM) / mor (GM)
// COLORNOTODEFAULT=03b2          // grey (anything else) / gri (diğerleri)

// COLORINVISITEM - Hue in which a GM sees an invisible item.
//                  GM'in görünmez bir eşyayı gördüğü renk.
// Type / Tür: hex hue (0 = default item colour, 1000 = invisible grey)
//             hex hue (0 = eşyanın kendi rengi, 1000 = görünmez gri)
// Default / Varsayılan: 1000
// [READ ONLY] / [OKUNUYOR] — Only read back through SERV.COLORINVISITEM; item
//                            drawing does not use it.
//                            Yalnızca SERV.COLORINVISITEM ile okunur; eşya
//                            çiziminde kullanılmıyor.
ColorInvisItem=1000

// COLORINVIS / COLORINVISSPELL / COLORHIDDEN - A non-zero value switches off the
//     client's grey overlay (mobile flag 0x80) for a character in that state:
//     GM invisibility / the invisibility spell or potion / hidden (Source-X
//     CCharStatus.cpp:687). The hue itself is not applied to drawing in SphereNet.
//     0 dışı bir değer, o durumdaki karakter için istemcinin gri örtüsünü (mobil
//     bayrak 0x80) kapatır: GM görünmezliği / invisibility büyüsü veya iksiri /
//     gizlenmiş (Source-X CCharStatus.cpp:687). Hue'nun kendisi SphereNet'te
//     çizime uygulanmaz.
// Type / Tür: hex hue
// Default / Varsayılan: 0 (grey overlay used / gri örtü kullanılır)
// [WORKING] / [ÇALIŞIYOR] — GameClient.BuildMobileFlagsFor.
ColorInvis=0
ColorInvisSpell=0
ColorHidden=0

// PETSINHERITNOTORIETY - Which notoriety statuses a pet inherits from its owner.
//                        Petin sahibinden hangi notoriety durumlarını devraldığı.
// Type / Tür: flags (0x prefix or leading zero = hex / 0x öneki veya baştaki sıfır = hex)
//   001 NotoGood (blue / mavi)          002 NotoGuildSame (green ally / yeşil müttefik)
//   004 NotoNeutral (grey / gri)        008 NotoCriminal (grey criminal / gri suçlu)
//   010 NotoGuildWar (orange / turuncu) 020 NotoEvil (red / kırmızı)
//   040 NotoInvul (yellow / sarı)
//   e.g. 07a shows the pet as criminal/warring/evil/allied/invul whenever its
//   owner is, whatever the pet's own notoriety.
//   örn. 07a, sahibi suçlu/savaşta/kötü/müttefik/ölümsüz ise peti de öyle
//   gösterir; petin kendi notoriety'si ne olursa olsun.
// Default / Varsayılan: 0
// [READ ONLY] / [OKUNUYOR] — Only read back through SERV.PETSINHERITNOTORIETY; pet
//                            notoriety does not use it.
//                            Yalnızca SERV.PETSINHERITNOTORIETY ile okunur; pet
//                            notoriety'si hesaplanırken kullanılmıyor.
PetsInheritNotoriety=0

// ============================================================================
// EXPANSION FLAGS / GENİŞLEME PAKETİ BAYRAKLARI (EXPANSION SUPPORT)
// ============================================================================
// Each flag enables expansion-specific features and client packets. 0 = off,
// hex bitmask = on. All FEATURE* keys are OR'ed and sent to the client at login
// in the 0xB9 PacketFeatureEnable packet (GameClient.ServerFeatureFlags,
// filled from the config in Program.cs).
// Her bayrak genişleme paketine özel özellikleri ve istemci paketlerini açar.
// 0 = kapalı, hex bit maskesi = açık. Tüm FEATURE* anahtarları OR'lanıp login'de
// 0xB9 PacketFeatureEnable paketiyle istemciye gönderilir
// (GameClient.ServerFeatureFlags, Program.cs'te config'ten doldurulur).

// FEATURET2A - The Second Age (1998)
// Type / Tür: hex/integer — Source-X FEATURE_T2A capability mask (update/chat).
//             Not a raw 0xB9 bit; mapped to protocol bits by the client's ResDisp.
//             Source-X FEATURE_T2A yetenek maskesi (update/chat). Ham 0xB9 biti
//             değildir; istemcinin ResDisp seviyesine göre protokol bitlerine çevrilir.
// Default / Varsayılan: 0x1
// [WORKING] / [ÇALIŞIYOR] — GameClient.ServerFeatureT2A, 0xB9.
FEATURET2A=0x3

// FEATURELBR - Lord Blackthorn's Revenge (2002)
// Type / Tür: hex/integer — Source-X FEATURE_LBR mask (update/sound).
//             Source-X FEATURE_LBR maskesi (update/sound).
// Default / Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — GameClient.ServerFeatureLBR, 0xB9.
FEATURELBR=0x3

// FEATUREAOS - Age of Shadows (2003)
// Type / Tür: hex/integer — Source-X FEATURE_AOS mask; includes the update-A,
//             update-B, popup and tooltip sub-features.
//             Source-X FEATURE_AOS maskesi; update-A/update-B/popup/tooltip alt
//             özelliklerini içerir.
// Default / Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — 0xB9; bit 0x02 (update-B) also turns on the AOS combat
//                           systems (Character.FeatureAOS).
//                           0xB9; 0x02 biti (update-B) AOS savaş sistemlerini de açar.
FEATUREAOS=0xF

// FEATURESE - Samurai Empire (2004)
// Type / Tür: hex/integer — Source-X FEATURE_SE mask / maskesi.
// Default / Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — 0xB9; bit 0x02 enables the SE parry formula
//                           (COMBATPARRYINGERA 0x02).
//                           0xB9; 0x02 biti SE parry formülünü açar
//                           (COMBATPARRYINGERA 0x02).
FEATURESE=0x3

// FEATUREML - Mondain's Legacy (2005)
// Type / Tür: hex/integer — Source-X FEATURE_ML mask / maskesi.
// Default / Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — GameClient.ServerFeatureML, 0xB9.
FEATUREML=0x1

// FEATUREKR - Kingdom Reborn client support (2007)
//             Kingdom Reborn istemci desteği (2007)
// Type / Tür: hex/integer
// Default / Varsayılan: 0
// Note / Not: The KR client is no longer in use. / KR istemcisi artık kullanılmıyor.
// [WORKING] / [ÇALIŞIYOR] — GameClient.ServerFeatureKR.
FEATUREKR=0

// FEATURESA - Stygian Abyss (2009)
// Type / Tür: hex/integer — Source-X FEATURE_SA mask / maskesi.
// Default / Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — GameClient.ServerFeatureSA, 0xB9.
FEATURESA=0x3

// FEATURETOL - Time of Legends (2015)
// Type / Tür: hex/integer — Source-X FEATURE_TOL mask / maskesi.
// Default / Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — 0xB9, including the virtual gold bit.
//                           0xB9, sanal altın (virtual gold) biti dahil.
FEATURETOL=0x1

// FEATUREEXTRA - Custom extra expansion bits.
//                Özel ek genişleme bitleri.
// Type / Tür: hex/integer
// Default / Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — Included in the FeatureFlags OR / FeatureFlags OR'una dahil.
FEATUREEXTRA=0

// RACIALFLAGS - Racial abilities (Source-X RACIALF_*).
