MOVEMENTQUEUECAPACITY=10

// SPEEDHACKDETECTIONENABLED - Speed-hack detection from movement history (0/1).
// Default: 0. [WORKING]
SPEEDHACKDETECTIONENABLED=0

// SPEEDHACKRATETHRESHOLD - Multiple of the expected step rate counted as a violation.
// Default: 1.5. [WORKING]
SPEEDHACKRATETHRESHOLD=1.5

// SPEEDHACKBURSTWINDOW - Consecutive steps looked at in the rate calculation.
// Default: 3. [WORKING]
SPEEDHACKBURSTWINDOW=3

// SPEEDHACKHISTORYSIZE - Length of the stored movement history (steps). Default: 20. [WORKING]
SPEEDHACKHISTORYSIZE=20

// SPEEDHACKCOOLDOWNMS - Time after a violation before another is reported (ms).
// Default: 60000. [WORKING]
SPEEDHACKCOOLDOWNMS=60000

// MOUNTHEIGHT - Mounted characters count 4 units taller for ceiling checks (0/1).
// Default: 0. [WORKING]
MOUNTHEIGHT=0

// ============================================================================
// LIGHT, WEATHER & SEASONS
// ============================================================================

// NOWEATHER - No weather (rain, snow) at all (0/1). Default: 1. [WORKING]
NOWEATHER=0

// LIGHTDAY - Daytime light level (0 = brightest, 30 = darkest). Default: 0. [WORKING]
LIGHTDAY=0

// LIGHTNIGHT - Night-time light level (0 = brightest, 30 = darkest). Default: 25. [WORKING]
LIGHTNIGHT=25

// DUNGEONLIGHT - Light level in dungeon regions (0-30). Default: 27. [WORKING]
DUNGEONLIGHT=27

// ALLOWLIGHTOVERRIDE - A pinned sector LIGHT overrides day/night (0/1). Default: 1. [WORKING]
ALLOWLIGHTOVERRIDE=1

// SEASONMODE - Season flow: Auto/0 = advance on interval, Manual/1 = fixed. Default: Auto.
// [WORKING]
SEASONMODE=Auto

// SEASONDEFAULT - Starting season: 0=Spring 1=Summer 2=Fall 3=Winter 4=Desolation.
// Default: 0. [WORKING]
SEASONDEFAULT=0

// SEASONCHANGEINTERVALMINUTES - Season change interval in Auto mode (minutes); 0 = off.
// Default: 30. [WORKING]
SEASONCHANGEINTERVALMINUTES=30

// ============================================================================
// STATE RECORDING & MACROS
// ============================================================================

// STATERECORDINGENABLED - Character state recording to SQLite (0/1). Default: 0. [WORKING]
STATERECORDINGENABLED=0

// STATERECORDPLAYERSONLY - Record player characters only, skip NPCs (0/1). Default: 1. [WORKING]
STATERECORDPLAYERSONLY=1

// STATERECORDMOVESCANMS - Movement scan interval (ms, at least 500). Default: 2000. [WORKING]
STATERECORDMOVESCANMS=2000

// STATERECORDSNAPSHOTMS - Full state snapshot interval (ms, at least 5000).
// Default: 15000. [WORKING]
STATERECORDSNAPSHOTMS=15000

// MACROENABLED - Player macro record/playback system (.MACRO) (0/1). Default: 1. [WORKING]
MACROENABLED=1

// MACROMAXSTEPS - Most steps one macro can record (5-200). Default: 50. [WORKING]
MACROMAXSTEPS=50

// MACROMAXLOOPMINUTES - Longest run time of a looping macro (minutes, 1-1440).
// Default: 120. [WORKING]
MACROMAXLOOPMINUTES=120

// ============================================================================
// ITEM DURABILITY
// ============================================================================

// ITEMDURABILITYENABLED - Weapons and armour take damage in combat (0/1). Default: 1. [WORKING]
ItemDurabilityEnabled=1

// ITEMDURABILITYLOSSCHANCE - Chance of taking damage on each hit (%). Default: 25. [WORKING]
ItemDurabilityLossChance=25

// ITEMDURABILITYLOSSMIN / ITEMDURABILITYLOSSMAX - Range of durability lost.
// Default: 1 / 1. [WORKING]
ItemDurabilityLossMin=1
ItemDurabilityLossMax=1

// ITEMBREAKONZEROHITS - 0 = item stays at 0 hits, 1 = it breaks and is deleted.
// Default: 1. [WORKING]
ItemBreakOnZeroHits=1

// ITEMDEFAULTHITS - Default durability for weapons/armour without HITS. Default: 50.
// [READ ONLY]
ItemDefaultHits=50

// ============================================================================
// DATABASE (MySQL / SQLite / PostgreSQL)
// ============================================================================
// Script DB.* connections: 1) classic single connection inside [SPHERE] (MYSQL*), or
// 2) named [MYSQL <name>] / [SQLITE <name>] / [PGSQL <name>] sections before [EOF].

// MYSQL - Enable the classic MySQL connection "default" (non-zero = on). Default: 0. [WORKING]
// MYSQL=0

// MYSQLHOST / MYSQLUSER / MYSQLPASSWORD / MYSQLDATABASE - Classic connection server, user,
// password, database (port always 3306). Default: "". [WORKING]
// MYSQLHOST=localhost
// MYSQLUSER=
// MYSQLPASSWORD=
// MYSQLDATABASE=

// MYSQLCHARSET - Classic connection session charset (SET NAMES). Default: "" (utf8mb4).
// MYSQLCHARSET=

// [MYSQL <name>] / [SQLITE <name>] / [PGSQL <name>] - Named connections. To use a template,
// remove the leading "// " and move it above [EOF]; "default" overrides the classic one.
// [WORKING]
//
// [MYSQL default]
// PROVIDER=MySqlConnector
// HOST=localhost
// PORT=3306
// USER=sphere
// PASSWORD=
// DATABASE=sphere
// KEEPALIVE=0
// CONNECTTIMEOUT=30
// READTIMEOUT=30
// WRITETIMEOUT=30
// USETHREAD=0
// AUTOCONNECT=1
// CHARSET=
//
// [SQLITE local]
// DATABASE=save/scriptdb.sqlite
// AUTOCONNECT=1
//
// [PGSQL stats]
// HOST=localhost
// PORT=5432
// USER=sphere
// PASSWORD=
// DATABASE=sphere
// AUTOCONNECT=1

