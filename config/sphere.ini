// [WORKING] / [ÇALIŞIYOR] — Character.CombatDamageEra -> CombatEngine.ResolveAttack.
COMBATDAMAGEERA=0

// COMBATHITCHANCEERA - Hit chance formula era (same values as Source-X).
//                      İsabet şansı formülü dönemi (Source-X ile aynı değerler).
// Type / Tür: integer (0-2)
//   0 = Sphere custom (not compatible with Hit Chance Increase)
//       Sphere özel (Hit Chance Increase ile uyumsuz)
//   1 = pre-AOS (not compatible with Hit Chance Increase / HCI ile uyumsuz)
//   2 = AOS
// Default / Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — Character.CombatHitChanceEra -> CombatEngine.ResolveAttack.
COMBATHITCHANCEERA=0

// COMBATSPEEDERA - Swing speed formula era (same values as Source-X).
//                  Salınım hızı formülü dönemi (Source-X ile aynı değerler).
// Type / Tür: integer (0-4)
//   0 = Sphere custom (uses DEX; recommended SPEEDSCALEFACTOR 15000)
//       Sphere özel (DEX kullanır; önerilen SPEEDSCALEFACTOR 15000)
//   1 = pre-AOS (uses STAM; recommended 15000 / STAM kullanır; önerilen 15000)
