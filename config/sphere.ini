// ============================================================================
// MAP CONFIGURATION / HARİTA YAPILANDIRMASI
// ============================================================================
// Format: MAP<id>=width,height,sectorSize,mulReadIndex,clientMapId
// Format: MAP<id>=genişlik,yükseklik,sektörBoyutu,mulOkumaIndex,istemciHaritaId
//
//   width/height   - map size in tiles, must match the .mul (multiple of 8)
//   genişlik/yükseklik - tile cinsinden harita boyutu, .mul ile eşleşmeli (8'in katı)
//   sectorSize     - sector grid size, a power of two (usually 64)
//   sektörBoyutu   - sektör ızgara boyutu, 2'nin kuvveti (genelde 64)
//   mulReadIndex   - which map<N>.mul / statics<N>.mul is read
//   mulOkumaIndex  - hangi map<N>.mul / statics<N>.mul okunur
//   clientMapId    - map id sent to the client
//   istemciHaritaId - istemciye gönderilen harita id'si
//
// Standard UO maps / Standart UO haritaları:
//   MAP0 = Felucca (6144x4096)   MAP1 = Trammel (6144x4096)   MAP2 = Ilshenar (2304x1600)
//   MAP3 = Malas (2560x2048)     MAP4 = Tokuno (1448x1448)    MAP5 = Ter Mur (1280x4096)
// Note / Not: MAP0..MAP255 are read. An empty value (MAPn=) disables the map; a
//             zero or missing field keeps its default; an invalid size or sector
//             size is reported at startup and the default kept.
//             MAP0..MAP255 okunur. Boş değer (MAPn=) haritayı kapatır; sıfır veya
//             eksik alan varsayılanını korur; geçersiz boyut/sektör açılışta
//             bildirilir ve varsayılan kalır.
// Default / Varsayılan: MAP0=6144,4096,64,0,0 (when no MAPn is given / hiç MAPn yoksa)
// [WORKING] / [ÇALIŞIYOR] — GameWorld sector setup and MapDataManager init.
//                           GameWorld sektör kurulumu ve MapDataManager init.

// 7168 = the full map0 width including the T2A/Lost Lands (6144 cuts the Lost
// Lands off; mortechUO teleport defs use x > 6144).
// 7168 = T2A/Lost Lands dahil tam map0 genişliği (6144 Lost Lands'i keser;
// mortechUO teleport tanımları x > 6144 kullanır).
// [WORKING] / [ÇALIŞIYOR] — see the block above / yukarıdaki bloğa bakın.
MAP0=7168,4096,64,0,0
MAP1=7168,4096,64,1,1
// MAP2=2304,1600,64,2,2
// MAP3=2560,2048,64,3,3
// MAP4=1448,1448,64,4,4
// MAP5=1280,4096,64,5,5

// USEMAPDIFFS - Apply the mapdif*/stadif* patch files over the maps.
//               mapdif*/stadif* yama dosyalarını haritaların üzerine uygula.
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — MapDataManager.UseMapDiffs.
USEMAPDIFFS=0

// ============================================================================
// FILE PATHS / DOSYA YOLLARI
// ============================================================================
// Absolute paths are used as they are. Relative paths are first looked up from
// the working directory (CWD); if not found there, from the server executable's
// directory.
// Mutlak yollar olduğu gibi kullanılır. Göreli yollar önce çalışma dizinine (CWD)
// göre aranır; orada yoksa sunucu çalıştırılabilir dosyasının dizinine göre çözülür.

// MULFILES - Path of the UO client data files (map*.mul, statics*.mul, tiledata.mul ...).
//            UO istemci veri dosyalarının yolu (map*.mul, statics*.mul, tiledata.mul ...).
// Type / Tür: string (directory / dizin yolu)
// Default / Varsayılan: "" (empty = look for a "mul" folder next to the
//                       working/server directory / boşsa çalışma/sunucu dizininde
//                       "mul" klasörü aranır)
// Note / Not: The server refuses to start if the folder cannot be found.
//             Klasör bulunamazsa sunucu başlamaz.
// [WORKING] / [ÇALIŞIYOR] — MapDataManager.
MULFILES=mul/

// SCPFILES - Path of the server script files (.scp).
//            Sunucu script dosyalarının yolu (.scp).
// Type / Tür: string (directory / dizin yolu)
// Default / Varsayılan: "scripts/"
// Note / Not: Source-X manifest root: spheretables.scp decides the exact load
//             order; folders/files commented out there are deliberately not loaded.
//             Source-X manifest kökü: yükleme sırasını spheretables.scp belirler;
//             orada yoruma alınmış klasör/dosyalar bilerek yüklenmez.
// [WORKING] / [ÇALIŞIYOR] — ResourceHolder scans this folder / bu dizini tarar.
SCPFILES=scripts/

// SCRIPTENCODING - Text encoding of the scripts: AUTO, UTF8 or LEGACY. AUTO tries
//                  UTF-8 first and falls back to SCRIPTLEGACYCODEPAGE when invalid.
//                  Script metninin kodlaması: AUTO, UTF8 veya LEGACY. AUTO önce
//                  UTF-8 dener, geçersizse SCRIPTLEGACYCODEPAGE'e düşer.
// Type / Tür: AUTO | UTF8 | LEGACY (anything else = AUTO + warning / başka = AUTO + uyarı)
// Default / Varsayılan: AUTO
// [WORKING] / [ÇALIŞIYOR] — ScriptFile.ConfigureTextEncoding.
SCRIPTENCODING=AUTO

// SCRIPTLEGACYCODEPAGE - Windows code page used by LEGACY and by the AUTO fallback.
//                        LEGACY ve AUTO geri dönüşünde kullanılan Windows kod sayfası.
// Type / Tür: integer (code page; 1254 for old Turkish scripts / eski Türkçe
//             scriptler için 1254)
// Default / Varsayılan: 1252
// [WORKING] / [ÇALIŞIYOR] — ScriptFile.ConfigureTextEncoding.
SCRIPTLEGACYCODEPAGE=1252

// LOG - Log output directory.
//       Log çıktı dizini.
// Type / Tür: string (directory / dizin yolu)
// Default / Varsayılan: "logs/"
// [WORKING] / [ÇALIŞIYOR] — Serilog file sink and the Host crash log.
//                           Serilog dosya sink'i ve Host çökme log'u.
LOG=logs/

// WORLDSAVE - Directory of the world save files (sphereworld.scp, spheredata.scp ...).
//             Dünya kayıt dosyalarının dizini (sphereworld.scp, spheredata.scp ...).
// Type / Tür: string (directory / dizin yolu)
// Default / Varsayılan: "save/"
// [WORKING] / [ÇALIŞIYOR] — WorldSaver / WorldLoader.
WORLDSAVE=save/

// ACCTFILES - Directory of the account files (sphereaccu.scp).
//             Hesap dosyalarının dizini (sphereaccu.scp).
// Type / Tür: string (directory / dizin yolu)
// Default / Varsayılan: "accounts/"
// [WORKING] / [ÇALIŞIYOR] — AccountPersistence.
ACCTFILES=accounts/

// ============================================================================
// SAVE SETTINGS / KAYDETME AYARLARI
// ============================================================================

// SAVEPERIOD - Automatic save interval (minutes).
//              Otomatik kaydetme aralığı (dakika).
// Type / Tür: integer (minutes, 0 = no automatic save / dakika, 0 = otomatik kayıt yok)
// Default / Varsayılan: 15 (Source-X: 20)
// [WORKING] / [ÇALIŞIYOR] — Program.Tick automatic save timer / otomatik kayıt zamanlayıcısı.
SAVEPERIOD=20

// FORCEGARBAGECOLLECT - Check/clean up world objects before every new save
//                       (Source-X). 0 skips the full scan. Not the .NET GC. The
//                       cleanup time is logged separately; the save timer starts
//                       after it.
//                       Her yeni kayıttan önce dünya nesnelerini denetle/temizle
//                       (Source-X). 0 tam taramayı atlar. .NET GC değildir.
//                       Temizlik süresi ayrı loglanır; kayıt sayacı temizlikten
//                       sonra başlar.
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 1
// [WORKING] / [ÇALIŞIYOR] — Program.Persistence BeginWorldSave.
FORCEGARBAGECOLLECT=1

// SAVEONSHUTDOWN - Save the world on a clean shutdown, so changes since the last
//                  periodic save survive a planned stop.
//                  Düzgün kapanışta dünyayı kaydet; son periyodik kayıttan sonraki
//                  değişiklikler planlı bir durdurmada kaybolmaz.
// Type / Tür: boolean (0/1)
// Default / Varsayılan: 1
// [WORKING] / [ÇALIŞIYOR] — Program.Tick shutdown path / kapanış yolu.
SAVEONSHUTDOWN=1

// SAVESECTORSPERTICK - Sectors saved per tick in a Source-X background save.
//                      Source-X arka plan kaydında tick başına kaydedilen sektör sayısı.
// Type / Tür: integer
// Default / Varsayılan: 1
// [READ ONLY] / [OKUNUYOR] — Only read back through SERV.SAVESECTORSPERTICK.
//     SphereNet's background save uses a snapshot + worker model (see
//     SAVEBACKGROUND); Source-X's per-tick sector staging is not used.
//     Yalnızca SERV.SAVESECTORSPERTICK ile okunur. SphereNet arka plan kaydını
//     snapshot + worker modeliyle yapar (SAVEBACKGROUND'a bakın); Source-X'in
//     tick başına sektör kademelemesi kullanılmaz.
SAVESECTORSPERTICK=1

// SAVESTEPMAXCOMPLEXITY - Source-X: the most object complexity one background-save
//                         step processes.
//                         Source-X: arka plan kaydının bir adımda işlediği en fazla
//                         nesne karmaşıklığı.
// Type / Tür: integer
// Default / Varsayılan: 500
// [READ ONLY] / [OKUNUYOR] — Only read back through SERV.SAVESTEPMAXCOMPLEXITY;
//                            the snapshot-based save has no step staging.
//                            Yalnızca SERV.SAVESTEPMAXCOMPLEXITY ile okunur;
//                            snapshot tabanlı kayıtta adım kademelemesi yok.
SAVESTEPMAXCOMPLEXITY=500

// SAVEBACKGROUND - Enable background saving.
//                  Arka plan kaydını aç.
// Type / Tür: integer (in Source-X a duration in minutes; in SphereNet any value
//             above 0 means "on")
//             integer (Source-X'te dakika cinsinden süre; SphereNet'te 0'dan büyük
//             her değer "açık")
//   0  = fully synchronous save (the world pauses for the whole save, ~1s+)
//        tam senkron kayıt (dünya kaydın tamamı boyunca durur, ~1sn+)
//   >0 = background save: the main loop only captures an immutable world snapshot
//        (~0.2-0.4s); sharding/compression/writing run on a low-priority worker
//        thread. Saves never overlap, a shutdown save waits for the one in
//        flight, atomic temp+commit is kept.
//        arka plan kaydı: ana döngü yalnızca değişmez bir dünya anlık görüntüsü
//        yakalar (~0.2-0.4sn); shard/sıkıştırma/yazma düşük öncelikli bir worker
//        thread'de koşar. Kayıtlar üst üste binmez, kapanış kaydı uçuştakini
//        bekler, atomik temp+commit korunur.
// Default / Varsayılan: 0
// [WORKING] / [ÇALIŞIYOR] — Program.Persistence.
SAVEBACKGROUND=1

// BACKUPLEVELS - Number of backup save generations kept.
//                Tutulacak yedek kayıt kuşağı sayısı.
// Type / Tür: integer (0 = no backup / yedek yok)
// Default / Varsayılan: 10
// Note / Not: Creates save_1/, save_2/ ... / save_1/, save_2/ ... oluşturur.
// [WORKING] / [ÇALIŞIYOR] — WorldSaver backup rotation / yedek rotasyonu.
BACKUPLEVELS=5

// SAVEFORMAT - Save file format.
//              Kayıt dosya formatı.
// Type / Tür: Text | TextGz | Binary | BinaryGz (or 0-3 / veya 0-3)
//   Text     = classic Sphere .scp text (human readable, large)
//              klasik Sphere .scp metni (insan okunabilir, büyük)
//   TextGz   = .scp.gz — the same text, gzipped (~85% smaller)
//              aynı metin, gzip sarılmış (~%85 daha küçük)
//   Binary   = .sbin — tag-stream binary (same (key,value) semantics, no schema)
//              tag-stream binary (aynı (key,value) semantiği, şema yok)
//   BinaryGz = .sbin.gz — binary + gzip (smallest / en küçük)
// Default / Varsayılan: Text (unknown value = Text / bilinmeyen değer = Text)
// Note / Not: The loader detects the format from the file extension, so switching
//             does not break older snapshots. Can also be changed at run time with
//             the .SAVEFORMAT command.
//             Yükleyici formatı dosya uzantısından algılar; değiştirmek eski
//             snapshot'ları bozmaz. Çalışırken .SAVEFORMAT komutuyla da değişir.
// [WORKING] / [ÇALIŞIYOR] — WorldSaver.
SAVEFORMAT=Text

// SAVESHARDS - Sharding mode.
//              Shard modu.
// Type / Tür: integer (0-16)
//   0    = always a single file, rolling off (classic Sphere)
//          her zaman tek dosya, rolling kapalı (klasik Sphere)
//   1    = size-based rolling: 1, 2, 3... files by SAVESHARDSIZEMB
//          boyuta göre rolling: SAVESHARDSIZEMB'e göre 1, 2, 3... dosya
//   2-16 = fixed parallel hash shards (N files, each written on its own task)
//          sabit paralel hash shard (N dosya, her biri kendi Task'inde yazılır)
// Default / Varsayılan: 3
// [WORKING] / [ÇALIŞIYOR] — WorldSaver.ShardCount.
SAVESHARDS=3

// SAVESHARDSIZEMB - Maximum size per file in rolling mode (MB).
//                   Rolling modunda dosya başına en fazla boyut (MB).
// Type / Tür: integer (MB)
// Default / Varsayılan: 75 (BinaryGz: ~4-6M items or ~900K-1.8M NPCs per shard)
//                          (BinaryGz: shard başına ~4-6M item veya ~900K-1.8M NPC)
// Note / Not: Only with SAVESHARDS=1. Starts with one file and opens
//             {base}.1.{ext}, {base}.2.{ext} past the limit; small worlds stay in
//             one file (classic Sphere behaviour).
//             Yalnızca SAVESHARDS=1 iken. Tek dosyayla başlar, limiti aşınca
//             {base}.1.{ext}, {base}.2.{ext} açar; küçük dünyalar tek dosyada kalır
//             (klasik Sphere davranışı).
// [WORKING] / [ÇALIŞIYOR] — WorldSaver.ShardSizeBytes.
SAVESHARDSIZEMB=75

// ============================================================================
// WORLD TIMING / DÜNYA ZAMANLAMASI
// ============================================================================

// GAMEMINUTELENGTH - Real-world length of one in-game minute (seconds).
//                    Oyun içi bir dakikanın gerçek dünya karşılığı (saniye).
// Type / Tür: integer (seconds, at least 1 / saniye, en az 1)
// Default / Varsayılan: 20 (same as Source-X / Source-X ile aynı)
// Note / Not: At 8 a full in-game day (24h) = 8*60*24 = 11520 s ≈ 3.2 real hours.
//             8'de tam bir oyun günü (24s) = 8*60*24 = 11520 sn ≈ 3.2 gerçek saat.
// [WORKING] / [ÇALIŞIYOR] — GameWorld.GameMinuteLengthMs (world clock, day/night).
//                           GameWorld.GameMinuteLengthMs (dünya saati, gece/gündüz).
GAMEMINUTELENGTH=8

// SERVERTICKMS - World-loop tick interval (milliseconds).
//                Dünya döngüsü tick aralığı (milisaniye).
// Type / Tür: integer (ms, clamped to 20-250 / 20-250 arasına kırpılır)
// Default / Varsayılan: 100 (10 ticks per second, as Source-X / saniyede 10 tick,
//                       Source-X gibi)
// Note / Not: Network I/O is not gated by this; it runs on every main-loop pass. A
//             script reading <TICKPERIOD> gets the ticks per second (1000/SERVERTICKMS).
//             Ağ G/Ç'si buna bağlı değildir; her ana döngü turunda çalışır.
//             <TICKPERIOD> okuyan script saniyedeki tick sayısını (1000/SERVERTICKMS)
//             alır.
// [WORKING] / [ÇALIŞIYOR] — Program.Tick main loop / ana döngü.
ServerTickMs=100

// TICKPERIOD - Classic key name kept as a legacy alias of SERVERTICKMS, read in
//              MILLISECONDS; only used when SERVERTICKMS is absent (so it is
//              commented out here).
//              SERVERTICKMS'in klasik adı (legacy alias), MİLİSANİYE olarak okunur;
//              yalnızca SERVERTICKMS yoksa kullanılır (bu yüzden burada yorumda).
// Type / Tür: integer (ms)
// Default / Varsayılan: 100
// [WORKING] / [ÇALIŞIYOR] — only when SERVERTICKMS is absent / yalnızca SERVERTICKMS yoksa.
// TICKPERIOD=100

// SECTORSLEEP - How long (minutes) a sector keeps ticking after the last player
//               leaves it before it goes to sleep.
//               Bir sektörün, içindeki son oyuncu ayrıldıktan sonra uykuya geçmeden
//               önce tick'lemeye devam ettiği süre (dakika).
// Type / Tür: integer (minutes, 0 = never sleep / dakika, 0 = asla uyuma)
// Default / Varsayılan: 10 (same as Source-X); this pack uses 1
//                       10 (Source-X ile aynı); bu paket 1 kullanır
// Note / Not: A sleeping sector runs no NPC AI or regeneration; item TIMERs fall to
//             the 3-minute maintenance sweep (decay has its own 5 s catch-up pass).
//             The sector the player stands in is stamped with this delay, not the
//             5x5 window, so the trail a traveller leaves is one sector wide.
//             0 is NOT Source-X's meaning. Source-X ticks every sector and leaves
//             the decision to _CanSleep; here the tick set is built from the 5x5
//             window and only sectors awake last tick are asked. So 0 means: a
//             sector once woken never sleeps again, and a sector nobody came near
//             still never ticks. The awake set only grows (measured: 32 -> 137
//             sectors while one player walks eight areas) and keeps growing. For
//             "almost never sleep" use a small value, not 0.
//             Uyuyan sektörde NPC AI ve yenilenme işlemez; item TIMER'ları 3
//             dakikalık bakım taramasına düşer (çürüme ayrı bir 5 sn'lik yakalama
//             geçişiyle yürür). Oyuncunun içinde bulunduğu sektör bu süreyle
//             işaretlenir, 5x5 penceresi değil: gezginin arkasında bıraktığı iz bir
//             sektör genişliğindedir. 0, Source-X'teki anlamıyla aynı DEĞİLDİR.
//             Source-X her sektörü tick'ler ve kararı _CanSleep'e bırakır; burada
//             tick kümesi 5x5 penceresinden kurulur ve yalnızca geçen tick uyanık
//             olan sektörlere sorulur. Yani 0 şu demektir: bir kez uyanan sektör bir
//             daha uyumaz, hiç yaklaşılmamış sektör ise yine hiç tick'lemez. Uyanık
//             küme yalnızca büyür (ölçüm: bir oyuncu sekiz alan gezerken 32 -> 137
//             sektör) ve büyümeye devam eder. "Neredeyse hiç uyumasın" için 0 değil
//             küçük bir değer kullanın.
// [WORKING] / [ÇALIŞIYOR] — Sector.SleepDelayMs.
SECTORSLEEP=1

// TIMERCALL - Interval of the server "timer" hook (Source-X f_onserver_timer).
//             Sunucu "timer" kancasının (Source-X f_onserver_timer) çağrılma aralığı.
// Type / Tür: integer (minutes; seconds when TIMERCALLUNIT=1)
//             integer (dakika; TIMERCALLUNIT=1 ise saniye)
// Default / Varsayılan: 0 = off / kapalı
// Note / Not: The interval (in its own unit) is passed as ARGN1 (Source-X
//             CWorld.cpp:1831). / Aralık (kendi biriminde) ARGN1 olarak verilir.
// [WORKING] / [ÇALIŞIYOR] — Program.Tick server hook / sunucu kancası.
TIMERCALL=0

// TIMERCALLUNIT - Unit of TIMERCALL: 0 = minutes, 1 = seconds.
